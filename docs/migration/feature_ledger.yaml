    notes: 'Every carried-forward issue has a fail-closed test. (1) Uncapped metal or oxide: with default configs,
      a Cu or Si-O cluster from extract_and_prepare is tagged h_capping_skipped (metal_system or oxide_system).
      The built-in CP2K writer (build_cp2k_input, write_cp2k_inputs, CP2KBackend.prepare_inputs) refuses it with
