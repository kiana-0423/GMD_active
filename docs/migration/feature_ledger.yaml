  - tests/unit/test_ood_score_stage.py
  phal_status: implemented
  external_deps: []
  gmd_active_equivalent: src/gmd_active_learning/monitors/ensemble_deviation.py
  destination: src/gmd_active_learning/monitors/ensemble_deviation.py
