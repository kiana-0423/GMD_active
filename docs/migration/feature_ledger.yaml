    labels and hotspot_indices exactly (test_graph_mode_can_be_restricted_to_the_subgraph parity).
  phase: 3
  notes: 'With radial_shell=true, the core role means within core_radius of any graph atom, not of the hotspot (graph_extractor.py:60).
    The neighbour graph of the whole frame is rebuilt on every call (30-36). It reads config.get("extraction", {})
    (28), while cluster mode reads config.get("extraction", config), so config nesting is inconsistent. With radial_shell=false
    all atoms are core, so cut-edge atoms get weight 1.0 and H capping caps nothing, because core is never in cap_allowed
    (h_capping.py:115-129). Dangling bonds then remain without the h_capping_skipped tag. An empty hotspot list
    raises ValueError from the cluster extractor. The production CP2K submitter never calls graph mode and silently
    uses cluster (cp2k_task_submitter.py:352-365). The radial shell is recorded as deliberate in docs/known-issues.md.
    Related findings: F-09.'
