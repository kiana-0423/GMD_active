      published through the ModelArtifact contract. Model ids are content-derived, so re-registering the same artifacts
      is idempotent (the existing record is re-verified and returned) and an existing id can never be overwritten.
      sha256 is recorded at registration and verified at every promotion and rollback; a tampered export blocks
      promotion. Concurrent writers (8 threads, 4 processes) share one SQLite store, with private staging directories
      per writer instead of PHAL's lock file. Promotion history lives in the store. Naming is model ids, not allegro_vNNN.
    source: lead.yaml
