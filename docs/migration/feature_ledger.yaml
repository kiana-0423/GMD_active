  destination: src/gmd_active_learning/extraction/h_capping.py
  disposition: port
  acceptance: Ethane, benzene, double-bond, oxide-skip, distant-metal and periodic-image fixtures give identical
    cap positions (atol 1e-10), metadata and skip reasons. A new test shows that allow_core_capping either caps
    core atoms or is removed, and that partial capping is flagged.
  phase: 3
  notes: 'Bond-length rule: a fixed X-H distance per parent element (default C 1.09, Si 1.48, O 0.96, N 1.01, S
    1.34, P 1.42, B 1.19). It is not scaled by the original bond length, ignores bond order (one H per cut neighbour),
    does not check clashes and does not enlarge the cell. BUG: allow_core_capping never caps core atoms, because
    core indices are never added to cap_allowed (h_capping.py:115-117). The core check at 128-129 is dead, and the
    flag only extends capping to inner_buffer. Partial capping is not tagged. Cut bonds on elements without bond_lengths
    (H, halogens) or on core/inner atoms stay dangling without h_capping_skipped, so the CP2K uncapped gate (cp2k_input.py:29-63)
    does not fire. The metal/oxide checks use region symbols plus cut bonds (92-113). Charge/spin is not handled
    here. cp2k_input.region_electronic_state calls utils/electronic_state.resolve_electronic_state on region.atoms,
    caps included. Charge comes from region metadata or cp2k.charge (default 0). Multiplicity comes from metadata
    or config, otherwise it is derived from parity; spin_policy auto corrects impossible values and strict raises
    (electronic_state.py:86-150). H-only relaxation: cp2k_input writes a GEO_OPT *_hopt.inp (cp2k_input.py:312-329),
    but the submitter only runs single_point_input (cp2k_task_submitter.py:144), so caps are never relaxed. h_capping.optimize_h_only
    is in the schema but never read. Block-region metadata is not updated after capping (see EXT-005). Related findings:
    F-04.'
  migration_status: verified
  evidence:
