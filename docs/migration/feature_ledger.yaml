  area: monitoring
  feature: Nonlinear LJ reference estimator and estimator switch (compute_lj_residuals)
  behavior: fit_local_lj_force fits (log eps, log sigma) per atom with scipy.optimize.least_squares (bounds eps
    1e-8..1e4, sigma 0.2..max(1.25*r_min, 0.6), max_nfev 400); invalid fits report max(residual, 1.0). compute_lj_residuals
