  behavior: 'poll_job(task_id): dry_run returns unchanged. With a scheduler job: SUBMITTED/PENDING/RUNNING -> walltime
    check (cancel, fail, retry) else pending/running; FAILED/CANCELLED -> failed + retry; UNKNOWN with no output
