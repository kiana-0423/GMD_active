    call at :23-32 is wasted work in block mode), :78 z_thickness = 2*z_margin. The "backend" metadata is the MLIP
    backend name (allegro) - re-express as the GMD_SGT model id. Depends on hotspot/ and extraction/ modules that
    belong to another ledger slice. Related findings: F-05.'
  migration_status: verified
  evidence:
    implementation:
    - src/gmd_active_learning/extraction/dispatch.py
    - src/gmd_active_learning/workflow/assembly.py
    - src/gmd_active_learning/events/rolling_buffer.py
    tests:
    - tests/workflow/test_event_extraction_phal_parity.py::test_event_extractor_reproduces_phal_regions
    - tests/workflow/test_event_extraction_phal_parity.py::test_all_nine_golden_events_are_covered
    - tests/workflow/test_event_extraction_phal_parity.py::test_later_trigger_atoms_are_recorded_but_not_extracted
    - tests/workflow/test_event_extraction_phal_parity.py::test_grouper_orders_regions_by_max_score_like_phal
    - tests/events/test_rolling_buffer.py::test_first_trigger_hotspots_are_kept_beside_the_merged_ones_al001
    - tests/active_learning/test_dispatch_and_surfaces.py::test_unknown_mode_raises_value_error
    - tests/extraction/test_extraction_phal_parity.py::test_raw_region_matches_phal
    findings:
    - F-05
    - F-15
    notes: 'All 9 golden events x 4 modes (36 cases) match PHAL through the production path: GMD monitor and event
      buffer replay -> EventRegionExtractor -> workflow.assembly.hotspot_grouper -> extract_regions. Region count
      and order, parent atom order, positions (5e-8 A, fixture precision) and parent step are identical. The earlier
      4-of-9 gap was a hotspot-source mismatch, not centring. PHAL extracted from the FIRST trigger''s result (atom_scores
      >= hotspot.threshold, merge_radius clusters, sorted by max score). GMD used the union over merged triggers,
      whose extra atoms were flagged in later frames, and kept clusters in first-appearance order. Fix: the buffer
      records the first trigger''s metadata.trigger_hotspot_atom_ids and trigger_atom_scores. The extractor cuts
      around those, and the grouper orders clusters by max score. event.hotspot_atom_ids still holds the union.
      Events written before this change fall back to it. Deliberate deviations: event_id and hotspot_id are stable
      ids (F-15), not PHAL''s "evt-<step>-<uuid>" and "<event>_hsNNN". Hotspot atoms come from the monitor''s single
      label threshold (no separate hotspot.threshold, F-16); the fixtures set both to 6.0. An unknown mode raises
      pydantic ValidationError, which is a ValueError.'
    source: lead.yaml
