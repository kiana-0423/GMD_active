- id: EXT-008
  area: extraction
  feature: Hydrogen capping of cut covalent bonds
  behavior: Uses a bond graph of the full source frame (covalent radii * covalent_scale 1.2, MIC). Capping is skipped,
    and the region tagged h_capping_skipped=True with h_capping_skipped_reason, when disabled (disabled_by_config),
    when the region holds a metal-like element (metal_system), or when the region is an oxide or any cut bond is
    O-(metal|Si) (oxide_system). Otherwise, for each atom in boundary+outer_buffer (+inner_buffer if allow_core_capping)
    whose element has a configured X-H length, it adds one H per bonded partner outside the region, at parent +
    L_XH * unit(MIC bond vector). Caps get original_indices -1, label "h_cap" and mask weight 0 if a mask exists.
    Metadata h_caps records parent_local_index, parent_original_index, broken_partner_original_index and bond_length.
