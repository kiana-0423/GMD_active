# PHAL -> GMD_active feature ledger (source of truth).
#
# One entry per PHAL capability. Validate with `python tools/migration/check_ledger.py`
# (schema, unique IDs, every reference resolves in phal_inventory.json, every inventoried
# PHAL file covered) and regenerate the overview with `python tools/migration/render_ledger.py`.
#
# phal_sources / phal_tests: paths relative to ref/lammps_monitor/ at commit 96263b6
#   (globs allowed; ":Symbol" suffix marks the part of a file an entry covers).
# destination: path in GMD_active, or "GMD:<path>" / "GMD_SGT:<path>" for capabilities that move
#   into a sibling project (replace-with-* dispositions only).
# migration_status: not-started -> in-progress -> migrated -> verified | replaced | dropped.
#   "verified" requires the acceptance test to pass without importing PHAL.
# Defects referenced as F-NN are described in docs/migration/findings.md.
#
# Phase 0 (2026-11-06): entries drafted from a full read of the PHAL tree; behaviour claims in
# `notes` cite file:line evidence. Review entries before starting the phase they belong to.

- id: MON-001
  area: monitoring
  feature: Per-atom force magnitude and force-burst (delta-force) metrics
  behavior: force_norms returns |F_i| per atom (row L2 norm, eV/A when frames come from LAMMPS metal units). delta_force_norms
    returns |F_i(t) - F_i(t-1)| per atom against the previous processed frame; with no previous frame it returns
    zeros (not NaN). The only temporal state is the previous force array, held by the caller (OnlineMonitor._previous_forces),
    not by the function.
  phal_sources:
  - src/hotspot_al/monitor/force_monitor.py
  symbols:
  - force_norms
  - delta_force_norms
  config_keys:
  - monitor.force_z_threshold
  - monitor.delta_force_z_threshold
  - ood_score.weights.force
  - ood_score.weights.delta_force
  phal_tests:
  - tests/unit/test_ood_score_stage.py
  - tests/unit/test_online_monitor.py
  - tests/e2e/test_offline_active_learning_pipeline.py
  phal_status: implemented
  external_deps: []
  gmd_active_equivalent: src/gmd_active_learning/monitors/physical_checks.py (frame-level max_force only, no per-atom
    vector, no delta)
  destination: src/gmd_active_learning/monitors/force.py
  disposition: port
  acceptance: For recorded (forces_t, forces_t-1) pairs the ported functions return identical arrays (rtol 1e-12),
    zeros for the first frame, and per-atom shape (N,).
  phase: 2
  notes: 'Formulas: force_monitor.py:10-13 (row_norms(F)), :16-23 (row_norms(F_t - F_prev), zeros if prev is None).
    Scoring lives in OODScorer: both are z-scored and gated, score = z if z >= threshold else 0 (ood_score.py:121-125,
    168-173); defaults force_z_threshold 4.0, delta_force_z_threshold 4.0, weights force 1.0, delta_force 1.5 (config/default.yaml:79-80,
    112-113). During warmup (first ood_score.running_stats.warmup_frames=5 scored frames) _z_score returns the RAW
    |F| in eV/A (ood_score.py:116-117), so the 4.0 "z" gate is applied to raw eV/A values for 5 frames. The zero
    delta on frame 0 is fed into the running stats (ood_score.py:373-382), biasing the delta_force baseline towards
    0. The previous-force reference is the previous *processed* frame, so the metric scales with dump interval;
    frames skipped by light_interval still advance it (online_monitor.py:247-249). No per-element normalisation:
    all species pooled.'
  migration_status: verified
  evidence:
    implementation:
    - src/gmd_active_learning/monitors/force.py
    - src/gmd_active_learning/monitors/staged_monitor.py
    tests:
    - tests/monitors/test_metrics.py::test_force_and_delta_force_norms
    - tests/monitors/test_phal_parity.py::test_phal_math_reproduces_every_frame_decision_and_metric
    findings:
    - F-16
    notes: 'Temporal reference = previous processed frame, aligned by stable atom ID (not array position). Deviation:
      with no previous frame the delta is NOT_EVALUATED (running_stats.first_frame_deltas: not_evaluated) instead
      of PHAL''s measured zeros that biased the baseline; ''zero'' reproduces PHAL. Keys: metrics.force/delta_force.{enabled,weight,z_threshold}.'
    source: monitoring.yaml
- id: MON-002
  area: monitoring
  feature: Per-atom single-step displacement (MIC) metric
  behavior: displacement_norms returns |MIC(r_i(t) - r_i(t-1))| per atom in A, using the exact minimum-image reduction
    from utils/periodic.py (orthorhombic rounding or Minkowski-reduced triclinic search); zeros when there is no
    previous frame. Temporal state (previous positions) is held by the caller.
  phal_sources:
  - src/hotspot_al/monitor/geometry_monitor.py:displacement_norms
  symbols:
  - displacement_norms
  config_keys:
  - monitor.displacement_z_threshold
  - ood_score.weights.displacement
  phal_tests:
  - tests/unit/test_geometry_monitor.py
  - tests/unit/test_ood_score_stage.py
  phal_status: implemented
  external_deps:
  - ase
  gmd_active_equivalent: none
  destination: src/gmd_active_learning/monitors/geometry.py
  disposition: port
  acceptance: Matches explicit image-loop displacements for non-periodic, orthorhombic and skewed partially periodic
    cells (port test_geometry_monitor.py:12-52) to 1e-12; zeros on first frame.
  phase: 2
  notes: geometry_monitor.py:24-38. Scored as z-score gated at displacement_z_threshold=4.0 (the gate is on z, not
    raw displacement; ood_score.py:179-183, test_ood_score_stage.py:151). MIC correction means a displacement larger
    than half the cell is folded back, so genuine >L/2 jumps are under-reported (only relevant for tiny cells or
    huge dump intervals). Depends on the previous processed frame, so the scale changes with dump frequency; z-scoring
    absorbs this after warmup only.
  migration_status: verified
  evidence:
    implementation:
    - src/gmd_active_learning/monitors/geometry.py
    tests:
    - tests/monitors/test_metrics.py::test_displacement_norms_match_explicit_minimum_image
    findings:
    - F-34
    notes: Exact MIC from utils/periodic.py (sub-lattice fix F-34 for skewed partial PBC). Same first-frame policy
      as MON-001.
    source: monitoring.yaml
- id: MON-003
  area: monitoring
  feature: Per-atom nearest-neighbour distance (rmin / close-contact) metric
  behavior: minimum_neighbor_distances_fast returns each atom's nearest-neighbour distance in A. For N < 512 it
    runs the exact all-pairs MIC scan (no cutoff; an isolated single atom reports 1e3); for N >= 512 it calls ase.neighborlist.neighbor_list
    with the MonitorNeighbors cutoff and reports the cutoff value for atoms without neighbours. Scored as lower-is-worse
    relative exceedance (thr - rmin)/thr, clipped at 0.
  phal_sources:
  - src/hotspot_al/monitor/geometry_monitor.py:minimum_neighbor_distances
  - src/hotspot_al/monitor/geometry_monitor.py:minimum_neighbor_distances_fast
  - src/hotspot_al/monitor/geometry_monitor.py:NO_NEIGHBOR_DISTANCE
  symbols:
  - minimum_neighbor_distances
  - minimum_neighbor_distances_fast
  - NO_NEIGHBOR_DISTANCE
  config_keys:
  - monitor.rmin_threshold
  - monitor.lj_cutoff
  - monitor.coordination_cutoff
  - ood_score.weights.rmin
  phal_tests:
  - tests/unit/test_geometry_monitor.py
  - tests/unit/test_monitor_fast_paths.py
  - tests/unit/test_ood_score_stage.py
  phal_status: implemented
  external_deps:
  - ase
  gmd_active_equivalent: src/gmd_active_learning/monitors/physical_checks.py (frame-global min pair distance, O(N^2),
    close_contact_distance=0.8)
  destination: src/gmd_active_learning/monitors/geometry.py
  disposition: merge-with-existing
  acceptance: Per-atom rmin equals brute-force MIC nearest distance for atoms with a neighbour inside the cutoff;
    no-neighbour atoms return a value >= cutoff and score 0; a 0.6 A contact with rmin_threshold=1.0 scores 0.4.
  phase: 2
  notes: 'geometry_monitor.py:41-60 (exact, chunked 512 rows) and :63-83 (fast). The "fast" path ignores the MonitorNeighbors
    object except for nl.cutoff and builds a fresh ASE neighbor_list each call (:78), duplicating the neighbour
    search already done by MonitorNeighbors.rebuild. Semantics differ by system size: <512 atoms gives the true
    nearest distance with no cutoff, >=512 caps at cutoff (inconsistency, harmless for scoring because both exceed
    any sane threshold). Score: ood_score.py:127-133 and 161-165; if "rmin" is absent from metrics the score is
    neutral 0 (not maximal). IMPORTANT default: monitor.rmin_threshold is null (default.yaml:82), and _threshold_score
    returns zeros for a None threshold (ood_score.py:128-129), so close-contact detection contributes NOTHING by
    default even though rmin is computed every frame. No running stats/z-score for rmin (threshold-only). GMD physical_checks
    is frame-global and also drives STOP (reliability_monitor.py:70-72); keep that hard-stop semantics as a separate
    rule when merging.'
  migration_status: verified
  evidence:
    implementation:
    - src/gmd_active_learning/monitors/geometry.py
    - src/gmd_active_learning/monitors/scoring.py
    - src/gmd_active_learning/monitors/staged_monitor.py
    tests:
    - tests/monitors/test_metrics.py::test_rmin_equals_brute_force_for_atoms_with_neighbours
    - tests/monitors/test_metrics.py::test_atom_without_neighbour_reports_cutoff_not_zero
    - tests/monitors/test_staged_monitor.py::test_rmin_score_for_a_0_6_angstrom_contact_with_threshold_1
    - tests/monitors/test_staged_monitor.py::test_close_contact_is_scored_with_default_threshold_and_stops
    - tests/monitors/test_scoring.py::test_rmin_scoring_threshold_and_null
    findings:
    - F-16
    notes: 'F-16 fixed: metrics.rmin.threshold defaults to 0.8 A (PHAL null scored nothing); null still means measured-not-scored.
      rmin comes from the shared neighbour list for every system size; atoms without a neighbour report the cutoff
      (PHAL: exact distance below 512 atoms); threshold must be < cutoff (validated). GMD physical_checks hard-stop
      semantics kept as actions.stop_min_distance (0.6 A) -> FrameAction.STOP. A contact contributes at most weight*1
      to the atom score (PHAL formula), documented.'
    source: monitoring.yaml
- id: MON-004
  area: monitoring
  feature: Smooth coordination number and per-atom coordination change (delta_q)
  behavior: q_i = sum_j 1 / (1 + (r_ij / (1.15*(R_cov,i + R_cov,j)))^6) over neighbours within coordination_cutoff
    (ASE covalent radii, dimensionless); delta_q_i = |q_i(t) - q_i(t-1)|, zeros on first frame. Temporal state is
    the previous q array kept by the caller. Scored as max(z-score, relative exceedance over delta_q_threshold).
  phal_sources:
  - src/hotspot_al/monitor/coordination_monitor.py
  symbols:
  - smooth_coordination_numbers
  - smooth_coordination_numbers_fast
  - coordination_deltas
  config_keys:
  - monitor.coordination_cutoff
  - monitor.delta_q_threshold
  - ood_score.weights.delta_q
  - monitor.coordination_scale
  - monitor.coordination_smoothing_power
  phal_tests:
  - tests/unit/test_monitor_fast_paths.py
  phal_status: implemented
  external_deps:
  - ase
  gmd_active_equivalent: src/gmd_active_learning/utils/geometry.py:coordination_number_summary (hard-cutoff integer
    counts, frame min/mean/max only)
  destination: src/gmd_active_learning/monitors/coordination.py
  disposition: port
  acceptance: For N<256 and N>=256 code paths, q matches the reference formula restricted to the cutoff (rtol 1e-10);
    delta_q zeros on first frame; scoring of delta_q=1.0 with threshold 0.5 and no stats gives max(1.0, 1.0)=1.0.
  phase: 2
  notes: 'coordination_monitor.py:16-43 (O(N^2) reference, NO cutoff, so it disagrees with the fast path by design),
    :46-92 (fast; per-atom NL loop below 256 atoms, ASE neighbor_list("ijd") above), :95-101 (delta). Scoring ood_score.py:175-178:
    max(_z_score (NOT gated by any z threshold), (dq-0.5)/0.5 clipped); delta_q_threshold default 0.5 (default.yaml:81).
    DEAD CONFIG: monitor.coordination_scale and monitor.coordination_smoothing_power are schema-validated (config_schema.py:97-98)
    and present in default.yaml:84-85 but OnlineMonitor calls smooth_coordination_numbers_fast(atoms, nl) without
    them (online_monitor.py:181), so the hard-coded 1.15 / 6 always apply. The rational switching function is truncated
    at the cutoff without smoothing (small discontinuity when neighbours cross 6 A). Above 256 atoms the shared
    MonitorNeighbors list is ignored and a fresh ASE neighbor_list is built (:82).'
  migration_status: verified
  evidence:
    implementation:
    - src/gmd_active_learning/monitors/coordination.py
    tests:
    - tests/monitors/test_metrics.py::test_smooth_coordination_matches_reference_within_cutoff
    - tests/monitors/test_metrics.py::test_coordination_scale_and_power_are_honoured
    - tests/monitors/test_metrics.py::test_coordination_deltas_zero_on_first_frame
    - tests/monitors/test_scoring.py::test_delta_q_threshold_scoring_without_stats
    findings:
    - F-16
    notes: 'Decision: coordination_scale / coordination_smoothing_power are HONOURED (metrics.delta_q.scale/power,
      defaults 1.15/6 = PHAL''s hard-coded values, so PHAL parity holds). One vectorised path for all sizes (tested
      at 32 and 256 atoms); the cutoff truncation without smoothing is kept.'
    source: monitoring.yaml
