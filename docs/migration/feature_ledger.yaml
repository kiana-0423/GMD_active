    The mitigation would be a smaller per-group NBUFFER in configs/cp2k/pulay_sampling_plan.json. (5) Pulay export
    closed-form check: measured worst case 1.25e-7, under the 1e-6 tolerance, still monitored (cp2k_ml_scf/pulay_dataset.py:~539).
    (6) SCF_GUESS ML: fixed in the external CP2K fork (ml_scf_try_initial_guess and ml_scf_normalise_electrons are
    not in this repo). PHAL parses ml_guess_source and prediction_success (cp2k_ml_scf/guess_benchmark.py:85-87).
    Deliberate behaviours: container scaffolds; generate_atom_mask mutates the region (mask_generator.py:30-42),
    with the pure build_atom_mask at 11-27; block min_atoms_policy (block.py:330-348); graph radial_shell (graph_extractor.py:55-59);
    retraining.sample_trigger is legacy only (retrain_trigger.py:69, absent from the schema). Not listed in the
    doc: the block+H-cap dataset crash (EXT-005), the slab repeats>1 bug (EXT-002), graph/slab modes being ignored
    by the CP2K submitter, and the unrun H-only GEO_OPT.'
