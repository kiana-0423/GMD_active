- id: TRN-006
  area: training
  feature: Filesystem model registry with deploy / rollback
  behavior: 'root_dir/registry.json holds {models: [{version, path, created_at, training_set_size, validation_metrics,
    metadata}], deployed_version}. register_model copy2''s the artifact to root/<version><suffix or .pth>, with
    auto version allegro_vNNN (max+1). deploy(version or latest) runs a smoke test (file exists and is non-empty),
