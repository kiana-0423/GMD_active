- id: EXT-003
  area: extraction
  feature: Graph (bonded-subgraph) extraction
  behavior: Builds a covalent bond graph over the whole source frame (covalent radii * h_capping.covalent_scale,
    MIC-aware). It runs BFS from the hotspot atoms out to extraction.graph.hops (default 2), then calls extract_cluster_region
    seeded with the whole subgraph. With radial_shell=true (default), this adds an extract_radius shell around every
    graph atom. With radial_shell=false it forces extract_radius=0 and min_atoms=len(graph), so the region is exactly
    the subgraph and every atom is labelled core. Afterwards it resets hotspot_indices to the triggering atoms and
    adds metadata mode=graph, graph_hops, graph_atom_indices, n_graph_atoms.
