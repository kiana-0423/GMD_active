    fallback is actually resubmitted (fixing the PHAL bug) and recorded; a timeout cancels and then retries; walltime
    string parsing matches a table.'
  phase: 5
  notes: 'cp2k_task_submitter.py:298-329, 398-447, 461-492. BUG: after _retry_natively converts the input, _retry_or_return
    returns at :409-410 without calling _submit_with_scheduler, so the native retry is never submitted and the job
    stays "failed"; it only moves if a caller polls the failed job again, which burns a further attempt (test_scf_production.py:763-795
    checks only the conversion). MAX_SCF escalation compounds because each retry edits the previous retry input
    (100 -> 200 -> 600) and is applied for every failure cause (scheduler failure, timeout, missing output). The
    fallback to cp2k.max_walltime / online.max_walltime (:463) is dead: max_walltime_seconds is a required schema
    key (null by default) so .get never falls back. Names chain (x_retry2_retry3.inp); no backoff, no cause classification,
