    - F-17
    notes: Cap positions, masks, codes and skip reasons match PHAL on every untorn fixture region, including the
      metal skips. Capping is a separate step applied through ExtractedRegion.with_caps (F-04 fix). Cut bonds are
      decided with integer image shifts, so in torn regions (guard policy flag) bonds whose partner exists only
      at another image are capped too; PHAL left them dangling, and the test asserts PHAL's caps are a subset of
      ours. allow_core_capping keeps PHAL's real meaning (also cap inner-buffer atoms); cap_core_atoms is the new
      switch that caps core atoms. Partial capping and every dangling bond are recorded. The uncapped-fragment gate
      is check_labelable. Charge and multiplicity come from resolve_region_electronic_state. H-only relaxation (F-17)
