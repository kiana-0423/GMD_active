- id: EXT-001
  area: extraction
  feature: Cluster extraction (spherical, non-periodic output)
  behavior: Selects every source atom whose minimum-image distance to the nearest hotspot atom is <= extract_radius
    (default mlip_cutoff+buffer_radius = 6+4 A; default.yaml sets 10.0 A). It pads up to min_atoms nearest-first
    and trims to max_atoms nearest-first, both silently. Positions are MIC displacements from the hotspot centroid,
    shifted so the minimum coordinate is vacuum_padding/2, inside an orthorhombic cell of ptp+2*vacuum_padding with
    pbc=False. Radial core/inner/outer/boundary roles come from EXT-007. Returns ExtractedRegion(original_indices
    = sorted 0-based source indices, local hotspot_indices, region_labels, metadata{mode, center, extract_radius,
    core_radius, boundary_thickness, vacuum_padding}).
