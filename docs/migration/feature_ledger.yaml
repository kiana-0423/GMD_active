- id: EVT-001
  area: events
  feature: Rolling pre/post-trigger frame buffer with trigger merging
  behavior: Keeps a deque of recent FrameData (maxlen = buffer.maxlen or pre+post+8). capture_event snapshots up
    to pre_trigger_frames preceding frames (excluding the trigger itself) and opens one pending event; later frames
    are appended as post context until post_trigger_frames are collected, then an EventRecord is finalised. A trigger
    while an event is pending is merged (hotspot atoms unioned, per-atom scores max-ed, reasons de-duplicated, trigger_steps/trigger_count/trigger_metadata
    appended) without extending the window. flush() finalises a pending event with whatever post frames exist.
  phal_sources:
  - src/hotspot_al/buffer/rolling_buffer.py
  - src/hotspot_al/buffer/__init__.py
  symbols:
  - RollingBuffer
  - RollingBuffer.push
  - RollingBuffer.capture_event
