  gmd_active_equivalent: src/gmd_active_learning/utils/structure_io.py
  destination: src/gmd_active_learning/datasets/writer.py
  disposition: port
  acceptance: 'For fixture regions (cluster, block, capped), the files written by GMD_active have identical extxyz
    arrays/info, NPZ keys/arrays and metadata JSON to PHAL output. Energy policy is explicit: either a written energy
    key with a flag, or a documented absence that a test asserts.'
  phase: 4
  notes: 'Energy semantics: no energy or stress is written to the extxyz or NPZ, so the cluster DFT energy is not
    a training target. It survives only as provenance. The CP2K submitter passes extra_metadata.cp2k_result = CP2KResult.provenance()
    {energy_ev, stress_gpa, scf_converged, digests, ...} (cp2k_task_submitter.py:281-290; cp2k_result.py:71-89).
    energy_weight is always 0.0, because the submitter never sets it and training_mask.energy_weight is unread.
    CP2KResult''s energy regex needs a colon (cp2k_result.py:17), which CP2K v2026.2 output lacks; the same regex
    was fixed only in scf_history.py:19-22. energy_ev is therefore probably null on that version. Parent relation:
    original_frame_id (= frame.step), hotspot_id, event_id, source_hotspot_id and region_index (metadata) and original_indices
    (NPZ, -1 for caps). There is no parent-frame energy, no image shifts and no parent cell (block metadata only).
    The block+H-cap label-length bug raises at writer.py:43-44. Writes are not atomic, so a crash can leave a partial
    triple. Retraining reads only *.extxyz. Related findings: F-04.'
  migration_status: verified
  evidence:
    implementation:
    - src/gmd_active_learning/datasets/writer.py
    - src/gmd_active_learning/datasets/samples.py
    tests:
    - tests/datasets/test_dataset_io_roundtrip.py::test_per_sample_triple_keeps_phal_keys
    - tests/datasets/test_samples_and_masks.py::test_cluster_energy_is_written_but_not_trained_by_default
    - tests/datasets/test_samples_and_masks.py::test_stress_only_for_labeled_periodic_regions
    findings:
    - F-04
    - F-12
    notes: 'Same three-file layout and PHAL NPZ/metadata keys, plus force_weight, region_code, image_shift, energy
      and stress. Explicit energy policy: the region energy is written with energy_weight (non-periodic 0 and periodic
      0 by default, capped regions 0 unless allow_capped) and is never the parent''s (energy_is_parent_energy false).
      Stress is written only when labeled and periodic, otherwise stress_weight 0. Writes are atomic. Byte-identity
      with PHAL files is deliberately not kept (new keys, exact float formatting).'
