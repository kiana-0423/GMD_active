  phase: 2
  notes: 'lammps_controller.py:21-249. Online control is file tailing plus POSIX signals only: no fix python / fix
    external, no stop or command files, no LAMMPS library API, no halting or rewinding MD on an event, no in-run
    model hot swap (pair_coeff is fixed at input time). LAMMPS assumptions to re-express for GMD: (1) text custom
    dump with "ITEM: TIMESTEP" headers written with `dump_modify sort id flush yes` (lammps_input.py:139); (2) frame
    completeness inferred from the next header (:198-210), so the newest frame lags one dump interval; (3) columns
    id/type/x/y/z/fx/fy/fz(+vx..), per-atom energy only via a column named c_pe; (4) numeric types decoded by lammps.type_map;
    (5) metal units, time = step*timestep_fs; (6) LAMMPS box/tilt bounds and p/f/s/m boundary flags; (7) the command
    is exactly [lmp, -in, file] (lammps_runner.py:13-14) - no mpirun and no Kokkos switches, although the validated
