    false) -> failed + retry. Best-effort SCF-history recording for cp2k* engines. Then datasets.write_dataset_entry
    writes <task>.extxyz (forces, mask_weights, region codes), <task>_labels.npz and <task>_metadata.json (cp2k_output,
