    - tests/workflow/test_trigger_registry_parity.py::test_reregistering_is_idempotent_and_never_overwrites
    - tests/workflow/test_trigger_registry_parity.py::test_sha_is_verified_at_promotion_and_rollback
    - tests/workflow/test_trigger_registry_parity.py::test_concurrent_writers_in_threads_share_one_store
    - tests/workflow/test_trigger_registry_parity.py::test_concurrent_writer_processes_share_one_store
