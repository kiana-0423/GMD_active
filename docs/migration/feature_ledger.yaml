    - tests/adapters/gmd/test_engine.py::test_online_monitor_driver_runs_unchanged_on_the_gmd_stream
    - tests/adapters/gmd/test_engine.py::test_stop_action_stops_the_segment_cooperatively
    - tests/integration/test_gmd_real.py::test_cooperative_stop_and_model_change_at_segment_boundary
