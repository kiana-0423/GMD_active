- id: MON-006
  area: monitoring
  feature: Per-atom local LJ projection residual (linear estimator, lazy) - PHAL scoring path
  behavior: For each (suspicious) atom i, builds a = sum_j 2 d_ij / r^14 and b = sum_j -d_ij / r^8 (d_ij = r_j -
    r_i), solves the 3x2 least squares F_i ~ alpha*a + beta*b on column-normalised design, accepts only rank 2,
    condition <= 1e4, alpha>0, beta>0, sigma=(alpha/beta)^(1/6) in [0.2, 10]; epsilon = beta/(24 sigma^6). Residual
    = |alpha a + beta b - F_i| / (|F_i| + 1e-8) (dimensionless). Invalid fits report residual 1.0 (valid=False);
    lazily skipped atoms report 0.0 with evaluated=False. Single frame, no window, per-atom parameters, element-blind.
  phal_sources:
  - src/hotspot_al/monitor/lj_residual_fast.py
  - src/hotspot_al/monitor/lj_residual.py:LJFitResult
  - docs/adr/003-lj-linear-residual.md
  symbols:
  - compute_lj_residuals_fast
  - fit_local_lj_force_linear
  - skipped_fit
  - LJFitResult
  - DESIGN_CONDITION_LIMIT
  config_keys:
  - monitor.lj_cutoff
  - ood_score.lj_lazy_threshold
  - ood_score.weights.lj_residual
  phal_tests:
  - tests/unit/test_lj_residual_physical.py
  - tests/unit/test_monitor_fast_paths.py
  - tests/unit/test_ood_lazy_lj_statistics.py
  phal_status: implemented
  external_deps: []
  gmd_active_equivalent: src/gmd_active_learning/monitors/lj_projection.py
  destination: src/gmd_active_learning/monitors/lj_local.py
  disposition: port
  acceptance: '(1) Sign-corrected port: forces from ase.calculators.lj.LennardJones (F = -grad E) on a random Ar
    cluster give valid=True, residual < 1e-8 and recover (epsilon, sigma) to 1e-6 for every atom with >=2 non-collinear
    neighbours. (2) Lazy mask: only masked atoms are fitted; skipped atoms carry evaluated=False. (3) Ill-conditioned/collinear
    geometry returns valid=False.'
  phase: 2
  notes: 'Code: lj_residual_fast.py:38-95 (fit), :98-134 (lazy driver), :18-20 limits, :27-35 skipped sentinel.
    CONFIRMED BUG (sign inversion): with d = r_j - r_i (neighbor_utils.py:59) the physical LJ force on i is F_i
    = -24 eps sum (2 sigma^12/r^14 - sigma^6/r^8) d, i.e. alpha<0, beta<0 in PHAL''s basis, but the fit rejects
    alpha<=0 or beta<=0 (lj_residual_fast.py:81-83). Probe scratchpad/a1probe/lj_sign.py: ASE LennardJones forces
    on 30 Ar atoms -> valid fraction 0.0, residual 1.0 for every atom; the NEGATED forces fit exactly (residual
    7e-16, sigma 2.5, eps 0.01). The PHAL test hides this because its "exact LJ forces" use the same inverted convention
    (tests/unit/test_lj_residual_physical.py:23-31). Online consequence (probe staged.py): every lazily fitted atom
    on a physical LJ system scores lj_residual 1.0 (x weight 2.0). Mathematical weakness even after fixing the sign:
    2 free parameters per atom against 3 force components leaves 1 residual DOF, so the residual only measures the
    component of F_i normal to span{a,b} (plus the sign/sigma acceptance); it cannot detect wrong pair strengths.
    Doc drift: ADR 003 says "2x2 linear system ... Gram matrices" but the code solves 3x2 lstsq without normal equations
    (lj_residual_fast.py:61-79). Scoring: score = max(residual, z(residual)) for evaluated atoms, 0 for unevaluated
    (ood_score.py:299-303); stats updated only with evaluated atoms (ood_score.py:297, 378-380). Lazy mask = atoms
    whose weighted light score >= lj_lazy_threshold 3.0, else the single argmax atom if its light score > 0 (ood_score.py:249-254).
    Invalid fit (residual 1.0) is indistinguishable from a measured 1.0 in the scorer output; the valid/evaluated
    flags are not exported (only metadata.lj_fit_count). See MON-016 for comparison with GMD''s lj_projection.py.
    Related findings: F-01.'
  migration_status: verified
  evidence:
    implementation:
    - src/gmd_active_learning/monitors/lj_local.py
    - src/gmd_active_learning/monitors/staged_monitor.py
    tests:
    - tests/monitors/test_lj_local.py::test_exact_lj_forces_fit_with_zero_residual_and_recover_parameters
    - tests/monitors/test_lj_local.py::test_negated_forces_are_rejected_f01
    - tests/monitors/test_lj_local.py::test_corrected_fit_on_f_equals_phal_fit_on_minus_f
    - tests/monitors/test_lj_local.py::test_lazy_mask_fits_only_masked_atoms
    - tests/monitors/test_lj_local.py::test_collinear_and_ill_conditioned_geometries_are_invalid
    - tests/monitors/test_phal_parity.py::test_lj_residuals_match_phal_on_negated_forces
    - tests/monitors/test_phal_parity.py::test_corrected_lj_deviates_only_where_documented_f01
    findings:
    - F-01
    - F-20
    notes: 'F-01 fixed: basis a = sum -2d/r^14, b = sum d/r^8 (F = -grad E); corrected(F) == PHAL(-F) exactly, which
      the parity tests use. ASE LennardJones Ar cluster: valid, residual < 1e-8, eps/sigma to 1e-6. The F-20 doc
      drift (2x2 Gram vs 3x2 lstsq) is resolved by documenting the 3x2 solve. Limits/thresholds from metrics.lj_residual.*.
      Invalid fits still report 1.0 (as PHAL); counts in result.metadata.lj_fit_count / lj_invalid_count.'
    source: monitoring.yaml
