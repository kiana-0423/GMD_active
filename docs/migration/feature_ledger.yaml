- id: LAB-009
  area: labeling
  feature: CP2K retry, walltime and ML-to-native fallback policy
  behavior: '_retry_or_return: no retry in dry_run or when attempts > cp2k.max_retries (default 0, so one attempt).
    Otherwise attempts += 1; if the DFT backend exposes _strip_ml_keywords and fallback_to_standard_scf, the first
    retry rewrites the input to native CP2K (ml_fallback_used); else writes <stem>_retry<N>.inp with every "MAX_SCF
    n" line multiplied by max(2, attempt), clears scheduler_job/process, resubmits and sets "submitted". Walltime
    = cp2k.max_walltime_seconds (number, or [[h:]m:]s string) measured from submission with time.monotonic.'
