  phase: 7
  notes: 'lj_residual.py:48-53 _lj_pair_force has the same sign inversion (prefactor * displacement with displacement
    = r_j - r_i): probe lj_sign.py gives median residual 0.81 on true ASE LJ forces vs 4e-8 on negated forces. Not
    called by OODScorer/OnlineMonitor (only by the benchmark script and as estimator=''nonlinear''); its acceptance
    rules and residual scale differ from the linear path, so thresholds do not transfer (docstring :120-128). Candidate
    for drop if no diagnostic need. Related findings: F-01.'
  migration_status: not-started
- id: MON-008
  area: monitoring
  feature: Committee (ensemble) force deviation
  behavior: 'For predictions of shape (M, N, 3): sigma_i = sqrt( mean_m |F_i^m - mean_m F_i^m|^2 ) in eV/A (population
    std, ddof=0). Stateless. In the online monitor the committee is ALL backend.model_paths() (primary included);
    if no model paths exist the metric is simply not added.'
  phal_sources:
  - src/hotspot_al/monitor/committee_deviation.py
  - src/hotspot_al/monitor/online_monitor.py:_add_committee_metrics
  - src/hotspot_al/monitor/online_monitor.py:_committee_model_paths
  symbols:
  - committee_force_deviation
  config_keys:
  - monitor.committee_interval
  - ood_score.weights.committee
  phal_tests:
  - tests/unit/test_online_monitor.py
  - tests/unit/test_ood_score_stage.py
  phal_status: implemented
  external_deps: []
  gmd_active_equivalent: src/gmd_active_learning/monitors/ensemble_deviation.py
  destination: src/gmd_active_learning/monitors/ensemble_deviation.py
  disposition: merge-with-existing
  acceptance: committee_force_deviation(P) == compute_ensemble_deviation(P).per_atom_force_deviation for random
    P (verified numerically, allclose True); availability is carried explicitly (see notes) and a 1-model committee
    is reported as unavailable, not as zero.
  phase: 2
  notes: 'Formula committee_deviation.py:21-23 is mathematically identical to GMD ensemble_deviation.py:11-12 (norm
    of per-component population std); probe gmd_lj_sign.py confirms. No direct unit test of committee_force_deviation
    in PHAL. UNAVAILABLE vs ZERO: when model_paths() is empty the key "committee" is never added (online_monitor.py:361-367);
    the scorer then zero-fills it (ood_score.py:279 np.zeros_like) and full-stage metric_scores["committee"] is
    an all-zero array - no None, NaN or flag anywhere in OODFrameResult. With exactly one model path, evaluate_committee
    returns (1,N,3) (backends/base.py:127-136) and the deviation is a *measured* exact 0.0 that costs an extra inference
    - indistinguishable from "unavailable". NaN cannot serve as the sentinel because _reject_non_finite_metrics
    raises DataError on any non-finite metric (ood_score.py:27-48). Scoring: max(raw eV/A, z) - mixes raw units
    with z-scores (ood_score.py:304); weight 2.0. If committee stats ever accumulated and the metric later goes
    missing, z(0) = mean/std is a spurious positive score. GMD reliability_monitor likewise zero-fills ensemble_max_deviation
    when absent (reliability_monitor.py:59-60). Migration: represent availability as Optional array + explicit evaluated
    mask in the MonitorResult contract. Related findings: F-06.'
  migration_status: not-started
- id: MON-009
  area: monitoring
  feature: MLIP re-evaluation force disagreement (mlip_force_deviation / model_drift)
  behavior: On physics/full frames the primary MLIP (model_paths()[0] or backend default) re-evaluates the frame
    and mlip_force_deviation_i = |F_i(frame) - F_i(MLIP)| in eV/A; also stores metrics["mlip_force"] = |F_MLIP|
    (unused by scoring). Scored by z-score only (no gate, no raw max), weight 2.0, reason label "model_drift".
  phal_sources:
  - src/hotspot_al/monitor/online_monitor.py:_add_mlip_metrics
  - src/hotspot_al/monitor/online_monitor.py:_primary_model_path
  symbols:
  - OnlineMonitor._add_mlip_metrics
  config_keys:
  - ood_score.weights.mlip_force_deviation
  phal_tests:
  - tests/unit/test_ood_score_stage.py
  - tests/unit/test_online_monitor.py
  phal_status: implemented
  external_deps:
  - allegro
  - nequip
  gmd_active_equivalent: none
  destination: src/gmd_active_learning/monitors/force_disagreement.py
  disposition: port
  acceptance: With a fake backend returning frame forces + delta on atom k, deviation equals |delta| on k and 0
    elsewhere; the metric is only computed on physics/full stages and its stats only update on those frames.
  phase: 2
  notes: 'online_monitor.py:354-359; scored at ood_score.py:305 (pure z). If the MD engine runs the same deployed
    model, this measures deployment/precision drift (float32 engine vs Python re-evaluation), so after warmup the
    baseline std is tiny and min_std=1e-8 (default.yaml:128) can turn numerical noise into large z-scores (risk,
    not confirmed on real data). Selection bias: stats update only on escalated frames (light-triggered), so the
    baseline is drawn from already-suspicious frames. For GMD/GMD_SGT, this is "engine forces vs GMD_SGT reference
    inference"; needs an explicit precision tolerance instead of pure z.'
  migration_status: not-started
- id: MON-010
  area: monitoring
  feature: Running per-metric statistics and z-score normalisation
  behavior: RunningMetricStats keeps (count of atom samples, frame_count, mean, M2) per metric, merged batch-wise
    (Chan parallel update) over all atoms of every stats-updating frame, never decaying. z = |x - mean| / max(std(ddof=1),
    min_std) once frame_count >= warmup_frames (default 5); before that, or when running_stats.enabled is false,
    z = |x| (raw value).
  phal_sources:
  - src/hotspot_al/monitor/ood_score.py:RunningMetricStats
  - src/hotspot_al/monitor/ood_score.py:OODScorer._z_score
  - src/hotspot_al/monitor/ood_score.py:OODScorer._z_metric_score
  symbols:
  - RunningMetricStats
  config_keys:
  - ood_score.running_stats.enabled
  - ood_score.running_stats.warmup_frames
  - ood_score.running_stats.min_std
  phal_tests:
  - tests/unit/test_ood_score_stage.py
  - tests/unit/test_ood_lazy_lj_statistics.py
  phal_status: implemented
  external_deps: []
  gmd_active_equivalent: none
  destination: src/gmd_active_learning/monitors/running_stats.py
  disposition: port
  acceptance: Batch update equals single-pass mean/std of the concatenated samples (rtol 1e-12, incl. chunked updates);
    warmup counts frames not atoms; stats state round-trips through a checkpoint (new requirement).
  phase: 2
  notes: 'ood_score.py:51-85 (stats), 109-125 (z, gated z). Pooled over all species and all atoms; infinite memory
    (no window/EMA), so slow drifts (heating ramps) shift the baseline permanently. Stats are not persisted anywhere,
    so a restarted monitor re-enters warmup. During warmup raw values are compared to z-thresholds (unit mixing;
    test_ood_score_stage.py:124 pins this). Stats are updated after scoring (current frame not in its own baseline)
    and only by the final scoring call per frame (update_stats=False on intermediate stages, online_monitor.py:214,
    220). Physics/full-only metrics (lj_residual, mlip_force_deviation, committee) only accumulate on escalated
    frames and LJ only on suspicious atoms - a selection-biased baseline that understates later anomalies. Related
    findings: F-06.'
  migration_status: not-started
- id: MON-011
  area: monitoring
  feature: Per-metric score transforms and lazy LJ evaluation inside OODScorer
  behavior: 'Maps raw metrics to non-negative per-atom scores - force/delta_force/displacement: gated z; rmin: (thr
    - rmin)/thr clipped (null thr -> 0); delta_q: max(z, (dq - thr)/thr clipped); lj_residual: max(raw, z) on evaluated
    atoms else 0; committee: max(raw, z); mlip_force_deviation: z. Missing metrics are zero-filled (rmin explicitly
    neutral). Non-finite metrics raise DataError.'
  phal_sources:
