    were taken on the lost fork with models/datasets that no longer exist.
  phase: 7
  notes: 'Key conclusions to preserve exactly - "The ML initial guess costs 63 SCF steps where CP2K''s atomic superposition
    costs 53" (failure_analysis:3-4); "On the chemistry it was fitted on, the model is not worse than the atomic
    guess: mean excess distance -9.6%. On chemistry it has never seen, it is +87.6% worse." (:41-43); distance-vs-cost
    Spearman +0.29 (:60-62). v2 - "The first density model was physically valid and did not accelerate anything."
    (ml_density_v2:3); "Result: it did not help" (:26); "Nothing improved. Across 48 ML runs, two beat the baseline
    on a single system and 39 were worse." (:64-65); "A perfect predictor saves 66% of all SCF steps" but 75% of
    the way saves 17% (:81-86); "There is no partial credit" (:101); "Neither is a production accelerator." (:122-123).
    ML Pulay - "Status: negative result. Experimental only - not a production backend." (ml_pulay_objective:3);
    11 -> 15 -> 37 steps (:81-82); "DIIS is not the weak link." (:105). Controller - native 8/12 converged, 172
    steps vs controller 8/12, 172, 0 rescued/0 lost (adaptive_scf_controller:53-58); "safe and neutral" (:75); "Twelve
    of twelve labels are keep" (:100); "Not delivered: any acceleration." (:136). Strategy - "The predictor does
