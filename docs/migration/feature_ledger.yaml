  - tests/unit/test_online_monitor.py
  phal_status: implemented
  external_deps: []
  gmd_active_equivalent: none (GMD ReliabilityMonitor keeps a frame deque only for the LJ window, reliability_monitor.py:20)
  destination: src/gmd_active_learning/events/rolling_buffer.py
  disposition: port
  acceptance: 'Port test_rolling_buffer.py verbatim (pre-frame truncation, consecutive-trigger merge, many triggers
    -> one event then a new one, shape-mismatch rejection keeps pending, flush, maxlen overflow, metadata); add:
    flushed events carry complete=False and n_post_expected, and finalised events are not retained unboundedly.'
  phase: 3
  notes: 'rolling_buffer.py:29-34 (init), 36-47 (push; frames whose step equals the trigger step are not counted
    as post), 49-104 (capture), 106-134 (merge), 136-141 (flush), 143-166 (finalise). Overlap: after an event finalises,
    a new trigger starts a fresh event whose pre_frames may include the previous event''s post frames (duplicated,
    no exclusion). Cooldown: NONE in the buffer or monitor; the only de-dup is OnlineMonitor._last_event_step ==
    frame.step (online_monitor.py:140). Block-level cooldown (extraction.block.cooldown_steps=1000, CooldownSkip)
    lives in the CP2K submitter, outside this slice. Bounds: pre context silently truncated if maxlen < pre_trigger_frames
    or the run just started; post window fixed at post_trigger_frames; post_trigger_frames=0 finalises immediately
    (:102-103). Early stop: OnlineMonitor.run''s finally calls flush() (online_monitor.py:115-118), producing an
    EventRecord with fewer post frames and NO incomplete/truncated marker (EventRecord has no such field; buffer
    sizes are not recorded in metadata). Merged triggers keep the FIRST trigger_frame while hotspot_atoms may include
    atoms flagged only on later frames (extraction will use first-frame positions for them). Event ids are "evt-<step>-<uuid4[:8]>"
    (:92) - not reproducible across reruns. BUG/RISK: self.events (:34, :161) accumulates every finalised EventRecord
