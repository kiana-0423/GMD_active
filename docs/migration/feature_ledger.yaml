    coordination_cutoff)/2 per atom) and returns, per atom, neighbour indices, MIC displacement vectors r_j + offset@cell
    - r_i (i.e. pointing FROM i TO j) and distances filtered to (1e-8, sub_cutoff].
  phal_sources:
