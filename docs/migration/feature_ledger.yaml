  acceptance: On fixture frames (orthorhombic and triclinic periodic bulk, molecular box, single atom, all-hotspot),
    the GMD_active extractor returns identical original_indices, region labels, hotspot_indices and metadata, and
    identical positions/cell (atol 1e-10). It also passes a new test that raises, or explicitly flags, an extract_radius
