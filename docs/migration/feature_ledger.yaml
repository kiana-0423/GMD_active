  gmd_active_equivalent: src/gmd_active_learning/monitors/lj_projection.py + src/gmd_active_learning/monitors/reliability_monitor.py
  destination: src/gmd_active_learning/monitors/lj_projection.py
  disposition: merge-with-existing
  acceptance: 'One module offers both modes behind a single sign convention (F = -grad E): mode=global_pair (GMD
    window fit) and mode=local_atom (PHAL per-atom). On ASE LennardJones forces both report is_physical/valid=True
    with residual < 1e-6 and recover eps, sigma; existing tests in both repos are rewritten to generate forces with
    ase.calculators.lj rather than the shared inverted formula.'
  phase: 2
  notes: 'GMD details: lj_projection.py:46-140 - pair types from all symbol pairs (:46-52), design rows = 3N per
    frame stacked over the window (deque window_size default 20, reliability_monitor.py:20, 50), basis 12 d/r^14
    and -6 d/r^8 with d = r_j - r_i added to i and subtracted from j (:73-85), O(N^2) pair loop, MIC via fractional
    rounding only (utils/geometry.py:8-16; not exact for skewed cells), ridge lambda=1e-6 toward theta0 (default
    0) (:88-97), frame residual |r|/|y| (:106) thresholded at 0.3 candidate / 0.6 stop (reliability_monitor.py:76-87),
    per-atom residual norms reported in eV/A but unused in decisions, is_physical requires A>0 and B>0 (:117-119),
    plus parameter-jump ratio (:143-160). PHAL details in MON-006. SIGN: physical F_i = (-12A/r^14 + 6B/r^8) d for
    d = r_j - r_i; both codes model +12A/r^14 - 6B/r^8, so physical forces give negative parameters. Probe gmd_lj_sign.py:
    on ASE LJ forces GMD returns A=-2383, B=-9.76, is_physical=False (residual 5e-4); on negated forces eps=0.009994,
    sigma=2.50001, is_physical=True. Effects: PHAL marks every fitted atom invalid (residual 1.0); GMD keeps a small
    residual (unconstrained sign) but raises lj_parameter_anomaly -> CANDIDATE on every frame (reliability_monitor.py:92-94).
    GMD''s own test (tests/test_lj_projection.py:16-20) uses the inverted convention too. Per-atom vs global: PHAL
    can localise (needed for hotspots) but is weak (1 residual DOF per atom); GMD is a strong global constraint
    but cannot localise and grows O(N^2 x window). Related findings: F-01.'
  migration_status: not-started
