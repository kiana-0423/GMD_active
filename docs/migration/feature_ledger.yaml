- id: EXT-004
  area: extraction
  feature: Block spatial-grid assignment and adjacent-block merging
  behavior: Grid shape per cell axis is max(1, ceil(|a_i|/size_i)). Atoms go to block floor(frac*n); fractional
    coordinates wrap mod 1 on periodic axes and are clipped on non-periodic axes. Anomalous atoms map to unique
    sorted (i,j,k) block ids. Blocks merge by 26-neighbour BFS, with PBC wrap (diff=min(d,n-d)) on periodic axes
    with n>1. Groups larger than max_merged_blocks (default 4) split into BFS-connected chunks of at most that size.
    Ids stay stable across frames while the cell is fixed (ADR 002).
