  gmd_active_equivalent: none
  destination: src/gmd_active_learning/labeling/retry_policy.py
  disposition: port
  acceptance: 'Unit tests: attempts stop at max_retries + 1; retry inputs carry the expected MAX_SCF; an ML -> native
    fallback is actually resubmitted (fixing the PHAL bug) and recorded; a timeout cancels and then retries; walltime
    string parsing matches a table.'
  phase: 5
  notes: 'cp2k_task_submitter.py:298-329, 398-447, 461-492. BUG: after _retry_natively converts the input, _retry_or_return
    returns at :409-410 without calling _submit_with_scheduler, so the native retry is never submitted and the job
    stays "failed"; it only moves if a caller polls the failed job again, which burns a further attempt (test_scf_production.py:763-795
    checks only the conversion). MAX_SCF escalation compounds because each retry edits the previous retry input
    (100 -> 200 -> 600) and is applied for every failure cause (scheduler failure, timeout, missing output). The
    fallback to cp2k.max_walltime / online.max_walltime (:463) is dead: max_walltime_seconds is a required schema
    key (null by default) so .get never falls back. Names chain (x_retry2_retry3.inp); no backoff, no cause classification,
    attempts not persisted. Related findings: F-05, F-17, F-24, F-25.'
  migration_status: verified
  evidence:
    implementation:
    - src/gmd_active_learning/labeling/retry_policy.py
    - src/gmd_active_learning/adapters/dft/cp2k/config.py
    - src/gmd_active_learning/adapters/dft/cp2k/input.py
    tests:
    - tests/labeling/test_retry_policy.py::test_scf_ladder_is_walked_in_order_then_exhausted
    - tests/labeling/test_retry_policy.py::test_total_retry_budget_bounds_everything
    - tests/labeling/test_retry_policy.py::test_walltime_parsing_table
    - tests/labeling/test_labeling_service.py::test_scf_retry_ladder_nbuffer_then_max_scf_without_compounding
    - tests/labeling/test_labeling_service.py::test_retry_budget_and_cap_are_bounded
    - tests/labeling/test_labeling_service.py::test_walltime_kill_is_classified_and_retried
    - tests/labeling/test_labeling_service.py::test_failed_ml_scf_attempt_is_resubmitted_natively
    - tests/adapters/dft/test_cp2k_real.py::test_retry_ladder_recovers_the_unconverged_run
    - tests/adapters/dft/test_cp2k_real.py::test_failed_ml_scf_run_is_resubmitted_natively
    findings:
    - F-25
    notes: 'F-25 fixed. - A failed ML-SCF attempt is resubmitted natively in the same poll. It is recorded as trigger_class
      ml_scf_failed, and LabelResult.metadata.ml_fallback_used is set. Verified with real CP2K. - Every failure
      class has its own bounded ladder of RetryStep overrides, applied to the base settings (never to the previous
      retry input) and capped by cp2k.retry.max_scf_cap. The total is bounded by cp2k.retry.max_retries (default
      3; PHAL 0). - Default SCF ladder: first diagonalization with Broyden mixing NBUFFER 4 (CP2K ignores &MIXING
      under OT), then OT with MAX_SCF x3. - Walltime and execution failures get one plain resubmission. invalid_result,
      which covers deterministic aborts such as a bad basis, and cancelled jobs are not retried. - Every attempt
      is persisted in its own attempts/NN-<stage> directory; there are no chained _retryN names. - Walltime parsing
      accepts [[D-]HH:]MM:SS or seconds. The walltime is enforced by the scheduler (local enforces it itself), not
      by monotonic time in the controller.'
    source: labeling.yaml
