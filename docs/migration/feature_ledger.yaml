  destination: src/gmd_active_learning/adapters/schedulers/local.py
  disposition: port
  acceptance: Submitting `python -c "raise SystemExit(0)"` / exit code 3 ends COMPLETED / FAILED with returncode
    recorded; cancelling a sleep job ends CANCELLED and the process exits; stdout file content is identical.
  phase: 5
  notes: 'schedulers.py:24-81. Real implementation. Not recoverable across restarts: a BackendJob rebuilt from the
    pid has no Popen, so poll returns the stale state (:66-68). cancel neither waits nor kills (zombie risk); CP2KTaskSubmitter
    implements its own terminate->kill for local timeouts (cp2k_task_submitter.py:215-226). Related findings: F-26.'
  migration_status: verified
  evidence:
    implementation:
    - src/gmd_active_learning/adapters/schedulers/local.py
    tests:
