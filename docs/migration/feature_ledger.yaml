- id: SCH-001
  area: scheduling
  feature: Local subprocess scheduler
  behavior: 'submit: mkdir work_dir, open stdout/stderr files (relative to work_dir, truncated), Popen(command,
    cwd, env = os.environ + request.environment) -> BackendJob(SUBMITTED, external_id=pid, native_handle=Popen).
    poll: Popen.poll -> RUNNING, COMPLETED (rc 0) or FAILED (rc != 0, metadata.returncode); without a Popen handle
    returns the stored state unchanged. cancel: SIGTERM if alive (no wait, no kill), state CANCELLED. request.resources
    is ignored.'
  phal_sources:
