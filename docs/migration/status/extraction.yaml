# Ledger status for the extraction / capping / embedding / masks / datasets area.
# TRN-005 and TRN-006 are owned by the workflow lead (retraining/triggers.py, retraining/registry.py).
- id: EXT-001
  status: verified
  implementation: [src/gmd_active_learning/extraction/cluster.py, src/gmd_active_learning/extraction/_placement.py]
  evidence:
    - tests/extraction/test_extraction_phal_parity.py::test_raw_region_matches_phal
    - tests/extraction/test_extraction_modes.py::test_cluster_radius_beyond_half_cell_is_flagged_and_torn_regions_are_refused
    - tests/extraction/test_extraction_modes.py::test_cluster_size_policies_are_explicit
    - tests/extraction/test_extraction_modes.py::test_cluster_on_molecule_single_atom_and_all_hotspots
    - tests/extraction/test_extraction_modes.py::test_triclinic_cluster_shift_invariant
  findings: [F-09]
  notes: >-
    Atom sets, roles, positions and cells match PHAL on all 13 golden cluster regions (atol 5e-8 because the fixture
    input has 8 decimals). Parent atom IDs and integer image shifts are recorded, and extract_radius > half the cell
    width is flagged (periodic_guard.radius_exceeds_half_cell). Torn regions follow periodic_guard.policy (default
    error). PHAL's silent min_atoms padding and max_atoms trimming are explicit (min_atoms_policy, max_atoms_policy)
    and recorded; hotspots are never trimmed. Config: extraction.*.
- id: EXT-002
  status: verified
  implementation: [src/gmd_active_learning/extraction/slab.py]
  evidence:
    - tests/extraction/test_extraction_phal_parity.py::test_raw_region_matches_phal
    - tests/extraction/test_extraction_modes.py::test_slab_multi_period_window_replicates_images_instead_of_an_empty_cell
    - tests/extraction/test_extraction_modes.py::test_slab_full_period_window_on_skewed_cell_keeps_source_lateral_vectors
    - tests/extraction/test_extraction_modes.py::test_slab_narrow_window_is_non_periodic_without_sub_bond_contacts
  findings: [F-08, F-09]
  notes: >-
    F-08 reproduced (5 A H lattice with a 16 A window) and fixed: slab.multi_period replicate (default) fills the
    15 A cell with 3x3 images, single_period (recorded) or error. A skewed cell with both axes at full period keeps
    the source lateral vectors; a single periodic axis in a skewed cell is UnsupportedCombinationError, or
    nonperiodic with skewed_policy. z vacuum is slab.z_vacuum (PHAL hard-coded 6 A). Hotspots outside the window
    are recorded.
