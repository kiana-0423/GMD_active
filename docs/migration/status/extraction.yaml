- id: DS-001
  status: verified
  implementation: [src/gmd_active_learning/datasets/writer.py, src/gmd_active_learning/datasets/samples.py]
  evidence:
    - tests/datasets/test_dataset_io_roundtrip.py::test_per_sample_triple_keeps_phal_keys
    - tests/datasets/test_samples_and_masks.py::test_cluster_energy_is_written_but_not_trained_by_default
    - tests/datasets/test_samples_and_masks.py::test_stress_only_for_labeled_periodic_regions
  findings: [F-04, F-12]
  notes: >-
    Same three-file layout and PHAL NPZ/metadata keys, plus force_weight, region_code, image_shift, energy and
    stress. Explicit energy policy: the region energy is written with energy_weight (non-periodic 0 and periodic 0
    by default, capped regions 0 unless allow_capped) and is never the parent's (energy_is_parent_energy false).
    Stress is written only when labeled and periodic, otherwise stress_weight 0. Writes are atomic.
    Byte-identity with PHAL files is deliberately not kept (new keys, exact float formatting).
- id: DS-002
  status: verified
  implementation: [src/gmd_active_learning/datasets/store.py, src/gmd_active_learning/datasets/split.py, src/gmd_active_learning/retraining/dataset_merger.py]
  evidence:
    - tests/datasets/test_dataset_store.py::test_publish_is_versioned_immutable_and_idempotent
    - tests/datasets/test_dataset_store.py::test_split_keeps_whole_events_together
    - tests/datasets/test_dataset_store.py::test_child_versions_are_cumulative_and_never_move_groups
    - tests/datasets/test_dataset_store.py::test_merge_datasets_publishes_through_the_store
    - tests/datasets/test_dataset_store.py::test_protocol_add_sample_is_idempotent_and_publish_honours_split_groups
  findings: [F-10, F-13]
  notes: >-
    Versioned immutable store (sha256 over files, parent, sample IDs, idempotent republication, deduplication,
    event-aware deterministic split with inheritance) instead of an overwritten train.extxyz. Masks and region
    codes are preserved per frame. merge_datasets keeps its name and arguments but publishes through the store
    and rejects placeholder parents. The legacy active_learning/workflow.py still passes the literal
    "existing_dataset", so tests/test_workflow.py::test_workflow_dry_run now fails until the lead rewires or
    retires that workflow.
