- id: EXT-008
  status: verified
  implementation:
  - src/gmd_active_learning/extraction/h_capping.py
  - src/gmd_active_learning/extraction/electronic.py
  evidence:
  - tests/extraction/test_extraction_phal_parity.py::test_capped_region_matches_phal_or_documents_the_torn_bond_fix
  - tests/extraction/test_capping_embedding.py::test_cut_ethane_gets_one_cap_along_each_broken_bond
  - tests/extraction/test_capping_embedding.py::test_capping_disabled_metal_and_oxide_are_recorded_skips
  - tests/extraction/test_capping_embedding.py::test_allow_core_capping_means_inner_buffer_and_cap_core_atoms_caps_core
  - tests/extraction/test_capping_embedding.py::test_electronic_state_of_a_capped_radical
  findings:
  - F-04
  - F-17
  notes: Cap positions, masks, codes and skip reasons match PHAL on every untorn fixture region, including the metal
    skips. Capping is a separate step applied through ExtractedRegion.with_caps (F-04 fix). Cut bonds are decided
    with integer image shifts, so in torn regions (guard policy flag) bonds whose partner exists only at another
    image are capped too; PHAL left them dangling, and the test asserts PHAL's caps are a subset of ours. allow_core_capping
    keeps PHAL's real meaning (also cap inner-buffer atoms); cap_core_atoms is the new switch that caps core atoms.
    Partial capping and every dangling bond are recorded. The uncapped-fragment gate is check_labelable. Charge
    and multiplicity come from resolve_region_electronic_state. H-only relaxation (F-17) is left to labeling.
