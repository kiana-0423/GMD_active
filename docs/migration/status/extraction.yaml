- id: EXT-005
  status: verified
  implementation: [src/gmd_active_learning/extraction/block.py]
  evidence:
    - tests/extraction/test_extraction_phal_parity.py::test_raw_region_matches_phal
    - tests/extraction/test_extraction_phal_parity.py::test_capped_block_regions_write_a_dataset
    - tests/extraction/test_capping_embedding.py::test_block_region_with_caps_writes_a_dataset
    - tests/extraction/test_extraction_modes.py::test_block_roles_trimming_and_policies
  findings: [F-04, F-09, F-18]
  notes: >-
    Roles, trimming and max/min-atom errors match PHAL. Trimming is recorded (trimmed_atom_ids). Block roles live
    only in ExtractedRegion.roles (no separate atom_role list), so capped block regions write datasets with
    region_code of length n_atoms (F-04). training_weights metadata uses the reconciled 0.3 inner-buffer weight
    (F-18). The hard-coded 2 A offset and 4 A padding are now block.vacuum_offset and block.cell_padding. Regions
    torn by the periodic boundary (all ethane and polyethylene fixture blocks) are refused by default.
