- id: TRN-001
  status: verified
  implementation: [src/gmd_active_learning/datasets/masks.py]
  evidence:
    - tests/datasets/test_samples_and_masks.py::test_region_codes_and_label_map_are_phal_byte_identical
    - tests/extraction/test_extraction_phal_parity.py::test_phal_capped_datasets_have_the_same_masks_and_codes
  findings: []
  notes: >-
    REGION_CODE_MAP and the region_label_map JSON are byte-identical to PHAL and checked against contracts
    REGION_CODES at import. PHAL-written extxyz region codes are decoded and compared. The canonical role store is
    the contract's RegionRole, so the lossy label_core -> core mapping no longer matters (the mode is region.mode).
- id: TRN-002
  status: verified
  implementation: [src/gmd_active_learning/datasets/masks.py, src/gmd_active_learning/extraction/_placement.py]
  evidence:
    - tests/extraction/test_extraction_phal_parity.py::test_capped_region_matches_phal_or_documents_the_torn_bond_fix
    - tests/extraction/test_extraction_phal_parity.py::test_capped_block_regions_write_a_dataset
    - tests/datasets/test_samples_and_masks.py::test_force_weights_follow_roles_with_a_single_inner_buffer_default
  findings: [F-04, F-18]
  notes: >-
    Masks match PHAL build_atom_mask exactly for cluster, graph, slab and block, with and without caps. The mask is
    the region's force_weights, a step function of roles (extraction.force_weights), so it cannot disagree with the
    roles; block regions with caps have n_atoms labels. Single inner-buffer default 0.3 (F-18). PHAL's mutating
    generate_atom_mask is replaced by the pure reweight().
- id: TRN-003
  status: migrated
  implementation: [tests/reference/masked_force_mse.py]
  evidence:
    - tests/reference/test_masked_force_loss.py::test_masked_force_mse_reduces_to_plain_mse_and_ignores_masked_atoms
    - tests/datasets/test_gmd_sgt_compat.py::test_gmd_sgt_weighted_loss_matches_numpy_oracle
  findings: [F-03]
  notes: >-
    The masked loss itself is implemented in GMD_SGT (another area). The NumPy oracle (PHAL masked_force_mse plus
    GMD_SGT's component-normalised weighted_force_loss) is here. GMD_SGT EnergyForceLoss._weighted on a batch
    collated from our exported file equals the oracle (rtol 1e-6) for rmse, mae and mse, with zero gradient on
    zero-weight atoms. Status stays migrated until GMD_SGT's own trainer test is recorded by that area.
