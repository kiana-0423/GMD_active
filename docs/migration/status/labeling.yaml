    - tests/adapters/schedulers/test_batch_schedulers.py::test_qstat_continuation_lines_are_joined
  findings: [F-26]
  notes: >-
    The qstat -f and qstat -x -f mappings match PHAL, with one deliberate fix: C and X are checked
    against Exit_status. C or X with a non-zero status is FAILED, and without a status it is UNKNOWN,
    left for reconcile; PHAL reported C as COMPLETED regardless. F without an exit status stays
    FAILED, as in PHAL. Exit status -29 or -11 sets walltime_exceeded. history_query_enabled is
    settable as scheduler.pbs.history_query_enabled; PHAL's schema rejected a `pbs` section.
    scheduler.pbs.flavor selects pbspro (-l select) or torque (-l nodes:ppn). Not verified: the live
    PBS Professional smoke on Miyabi, because PBS is not installed here.
- id: LAB-001
  status: verified
  implementation:
    - src/gmd_active_learning/adapters/dft/cp2k/input.py
    - src/gmd_active_learning/adapters/dft/cp2k/config.py
    - src/gmd_active_learning/labeling/service.py
  evidence:
    - tests/adapters/dft/test_cp2k_input.py::test_inputs_are_byte_identical_to_phal_for_equivalent_settings
    - tests/adapters/dft/test_cp2k_input.py::test_boundary_conditions_follow_the_region_exactly
    - tests/adapters/dft/test_cp2k_input.py::test_h_only_geo_opt_fixes_every_non_cap_atom
    - tests/adapters/dft/test_cp2k_real.py::test_h2_molecule_label
    - tests/adapters/dft/test_cp2k_real.py::test_h_capped_cluster_relaxes_caps_then_labels
    - tests/labeling/test_labeling_service.py::test_capped_region_runs_cap_relaxation_then_single_point
  findings: [F-17]
  notes: >-
    The _sp.inp and _hopt.inp inputs are byte-identical to PHAL 96263b6 for a capped cluster, an
    odd-electron radical and a periodic block when settings are equivalent (optional parity test,
    skipped once ref/ is gone). Real CP2K 2026.2 converges on H2, a capped CH3 (cap GEO_OPT, then the
    single point), a periodic H2 block and an XY slab.

    F-17 fixed: the cap-only GEO_OPT is submitted, and the single point runs on the relaxed caps.

    New finding (reproduced): CP2K 2026.2 aborts WAVELET with "Poisson solver for non cubic cells not
    yet implemented". PHAL's padded cluster cells are not cubic, so PHAL's default cluster inputs
    cannot run. Isolated regions now get a cubic padded box when WAVELET is used.

    Deliberate deviations:
    - PERIODIC (in &CELL and &POISSON) follows region.pbc exactly; cp2k.periodic is gone.
    - The solver is chosen per periodicity class (cp2k.poisson); an unsupported pair raises
      UnsupportedCombinationError.
    - The analytic stress is requested for XYZ regions (cp2k.stress auto|always|never).
    - Basis and potential file names, per-element kinds, extra_sections and template_path
      (string.Template placeholders $global_section, $force_eval_section, $motion_section) are
      configurable, and the template text enters the settings hash.
    - The deterministic settings hash covers physics fields only.
    - cp2k.data_dir is exported as CP2K_DATA_DIR; nothing is hard-coded.
    - Embedding raises UnsupportedCombinationError (PHAL raised ValueError).
    - scf_recording (AO matrices) is left to the SCF slice through decorate_input.
