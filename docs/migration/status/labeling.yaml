    - tests/adapters/dft/test_cp2k_input.py::test_execution_request_paths_are_work_dir_relative
  findings: []
  notes: >-
    BackendRole and RuntimeStatus are ported, together with a structural Backend protocol (name, role,
    capabilities, check_runtime) and an ExecutionRequest. They live in adapters/registry.py and
    adapters/schedulers/base.py, not in contracts/backends.py, which is a shared file outside this area.
