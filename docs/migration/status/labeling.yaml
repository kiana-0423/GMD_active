    - tests/labeling/test_labeling_service.py::test_prepare_is_idempotent_and_ids_depend_on_region_and_settings
    - tests/labeling/test_labeling_service.py::test_submit_is_idempotent
    - tests/labeling/test_labeling_service.py::test_ambiguous_submission_failure_marks_unknown_and_never_duplicates
    - tests/labeling/test_labeling_service.py::test_rejected_submission_leaves_task_resubmittable
    - tests/labeling/test_labeling_service.py::test_enabled_embedding_is_refused_before_a_task_exists
    - tests/labeling/test_labeling_service.py::test_capped_region_runs_cap_relaxation_then_single_point
    - tests/extraction/test_extraction_modes.py::test_block_cooldown_skips_and_state_survives_restart
    - tests/workflow/test_scheduling.py::test_restart_mid_queue_resubmits_nothing_already_submitted
    - tests/e2e/test_online_pipeline.py::test_online_loop_polls_the_label_to_completion_and_resumes_md_with_the_new_model
    - tests/integration/test_closed_loop_real.py::test_real_closed_loop_promotes_and_resumes_md_with_the_new_model
    - tests/adapters/dft/test_cp2k_real.py::test_restart_safe_idempotent_labeling
  findings: [F-05, F-17, F-24]
  notes: >-
    Replaced by LabelingService (prepare/submit/poll/collect) with an atomic, file-locked task.json that
    holds the job id, state, attempts and failure reasons. task_id = stable_id(region_id, region
    fingerprint, settings hash). PHAL's dry-run task tree cannot be reproduced, by design: there is no
    dry-run mode (the brief forbids implicit dry runs; cp2k.submit_mode is removed). PHAL's task.json held
    metadata only. The parts of the acceptance that carry over are shown. The CP2K files a task gets
    (<id>_hopt.inp when capped, <id>_sp.inp) are byte-identical to PHAL's for fixture regions, through the
    same CP2KBackend.prepare_inputs the service calls. The region is stored as region.json instead of
    region.extxyz. Block cooldown gives no region, hence no task, and never a failure (the workflow's
    "skipped"). One job per region is submitted through the scheduler. Re-preparing or re-submitting a
    known task, including a completed one, is a no-op, also across controller restarts. An ambiguous
    submission becomes UNKNOWN and is never duplicated. Extraction, capping and embedding happen upstream,
    so every extraction mode is labeled as given (F-05 fixed for this layer). The H-cap GEO_OPT is now run
    before the single point (F-17).
