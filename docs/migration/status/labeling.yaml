    - tests/labeling/test_retry_policy.py::test_total_retry_budget_bounds_everything
    - tests/labeling/test_retry_policy.py::test_walltime_parsing_table
    - tests/labeling/test_labeling_service.py::test_scf_retry_ladder_nbuffer_then_max_scf_without_compounding
    - tests/labeling/test_labeling_service.py::test_retry_budget_and_cap_are_bounded
    - tests/labeling/test_labeling_service.py::test_walltime_kill_is_classified_and_retried
    - tests/labeling/test_labeling_service.py::test_failed_ml_scf_attempt_is_resubmitted_natively
    - tests/adapters/dft/test_cp2k_real.py::test_retry_ladder_recovers_the_unconverged_run
    - tests/adapters/dft/test_cp2k_real.py::test_failed_ml_scf_run_is_resubmitted_natively
  findings: [F-25]
  notes: >-
    F-25 fixed.
    - A failed ML-SCF attempt is resubmitted natively in the same poll. It is recorded as
      trigger_class ml_scf_failed, and LabelResult.metadata.ml_fallback_used is set. Verified with
      real CP2K.
    - Every failure class has its own bounded ladder of RetryStep overrides, applied to the base
      settings (never to the previous retry input) and capped by cp2k.retry.max_scf_cap. The total is
      bounded by cp2k.retry.max_retries (default 3; PHAL 0).
    - Default SCF ladder: first diagonalization with Broyden mixing NBUFFER 4 (CP2K ignores &MIXING
      under OT), then OT with MAX_SCF x3.
    - Walltime and execution failures get one plain resubmission. invalid_result, which covers
      deterministic aborts such as a bad basis, and cancelled jobs are not retried.
    - Every attempt is persisted in its own attempts/NN-<stage> directory; there are no chained
      _retryN names.
    - Walltime parsing accepts [[D-]HH:]MM:SS or seconds. The walltime is enforced by the scheduler
      (local enforces it itself), not by monotonic time in the controller.
