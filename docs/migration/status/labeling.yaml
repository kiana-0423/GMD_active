- id: CFG-002
  status: in-progress
  implementation:
    - src/gmd_active_learning/adapters/dft/cp2k/config.py
    - src/gmd_active_learning/adapters/schedulers/config.py
    - src/gmd_active_learning/adapters/registry.py
  evidence:
    - tests/adapters/dft/test_cp2k_config.py::test_unknown_keys_and_phal_only_keys_are_rejected
  findings: [F-26]
  notes: >-
    This area provides three strict section models (cp2k, scheduler, backends); the full catalog
    belongs to the config owner.

    Key mapping for this area:
    - cp2k.periodic: dropped; region.pbc is used.
    - cp2k.poisson_solver: cp2k.poisson.{non_periodic,partially_periodic,periodic}_solver.
    - cp2k.charge: region.charge.
    - cp2k.submit_mode: backends.scheduler.engine (no dry-run).
    - cp2k.slurm_directives: cp2k.resources.extra_directives, typed per scheduler.
    - cp2k.max_unknown_polls: cp2k.max_unknown_polls_warning (warns only; never fails).
    - cp2k.max_walltime_seconds: cp2k.resources.walltime.
    - cp2k.labeled_dataset_dir: datasets area.
    - cp2k.single_point.*: dropped (the single point is the label).
    - cp2k.scf_recording.*: SCF slice (via decorate_input).
    - pbs.history_query_enabled: scheduler.pbs.history_query_enabled.
    - backend.<role>.engine: backends.<role>.engine.
    - plugins: backends.<role>.factory and entry points.
