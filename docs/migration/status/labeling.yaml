    cancel and reconcile. The DFT contract is CP2KBackend; its parse and validate steps fill the gap
    PHAL left in DFTBackend. MLIP/MD ABCs (GMD/GMD_SGT streaming ports) belong to the workflow lead and
    are not defined here.
