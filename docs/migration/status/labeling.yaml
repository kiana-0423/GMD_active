- id: LAB-007
  status: migrated
  implementation: [src/gmd_active_learning/labeling/service.py, src/gmd_active_learning/labeling/task_store.py]
  evidence:
    - tests/labeling/test_labeling_service.py::test_prepare_is_idempotent_and_ids_depend_on_region_and_settings
    - tests/labeling/test_labeling_service.py::test_submit_is_idempotent
    - tests/labeling/test_labeling_service.py::test_ambiguous_submission_failure_marks_unknown_and_never_duplicates
    - tests/labeling/test_labeling_service.py::test_rejected_submission_leaves_task_resubmittable
    - tests/labeling/test_labeling_service.py::test_enabled_embedding_is_refused_before_a_task_exists
    - tests/adapters/dft/test_cp2k_real.py::test_restart_safe_idempotent_labeling
  findings: [F-05, F-17, F-24]
  notes: >-
    The submitter is redesigned as LabelingService: prepare(region), submit(task), poll(task) and
    collect(task), with task.json written atomically and holding the job id, state, attempts and
    failure reasons under a file lock. task_id = stable_id(region_id, region fingerprint, settings
    hash), so preparing twice gives the same directory and job and a completed task is never
    resubmitted. An interrupted or timed-out submission becomes UNKNOWN and is never duplicated.
    Extraction, capping and embedding happen upstream: any extraction mode is labeled as given, which
    fixes F-05 for this layer. The scheduler comes from backends.scheduler.engine; cp2k.submit_mode is
    removed and there is no dry-run.
    Not provable here: task-tree parity with PHAL's dry-run tree, and block-cooldown "skipped" (both
    belong to the workflow).
- id: LAB-008
  status: migrated
  implementation: [src/gmd_active_learning/labeling/service.py]
  evidence:
    - tests/labeling/test_labeling_service.py::test_single_point_label_is_valid_and_converted
    - tests/labeling/test_labeling_service.py::test_completed_but_invalid_output_is_invalid_not_failed
    - tests/labeling/test_labeling_service.py::test_unknown_state_never_resubmits
    - tests/labeling/test_labeling_service.py::test_a_restarted_controller_resumes_from_task_json
    - tests/adapters/dft/test_cp2k_real.py::test_unconverged_run_is_invalid_with_reason
  findings: [F-24, F-25, F-27]
  notes: >-
    poll() refreshes the scheduler state. On UNKNOWN it calls scheduler.reconcile; if the state is
    still unknown it counts unknown_polls and warns after cp2k.max_unknown_polls_warning, but never
    fails or resubmits. This removes PHAL's race of reading a still-growing output while UNKNOWN; a
    resolve_unknown(task, reason) decision belongs to the workflow. On a terminal state, poll validates
    with the F-27 rule plus the atom count. ExecutionStatus and ValidationStatus are kept separate: a
    run that exits 0 but produces invalid output is COMPLETED/INVALID. collect() returns a LabelResult
    with energy, forces and stress in GMD units, the positions actually labeled (relaxed caps) and
    provenance. A restarted controller resumes the persisted job ids. A non-converged output never
    yields a VALID result.
    Not done here: writing the dataset entry (extxyz/npz/metadata) is the datasets area's job, so
    file-for-file parity with PHAL's dataset files is not shown in this area.
