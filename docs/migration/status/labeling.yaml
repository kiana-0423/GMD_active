    - tests/adapters/schedulers/test_batch_schedulers.py::test_hanging_submit_times_out
    - tests/adapters/schedulers/test_batch_schedulers.py::test_missing_submit_binary_raises_scheduler_error
  findings: [F-26]
  notes: >-
    Fake sbatch/qsub on PATH report job ids "42" and "42.fakepbs". Silent stdout raises; a non-zero
    exit or a missing binary raises SubmissionRejected (a SchedulerError); a timeout raises
    SchedulerError, because the outcome is unknown. Byte identity with PHAL scripts is dropped
    deliberately: the scripts now carry typed directives (#SBATCH --nodes/--ntasks/--time/--mem/
    --partition/--account; #PBS -l select=...:ncpus:mpiprocs:mem, -l walltime, -q, -A). They also
    carry an explicit cd and an exit-code wrapper, use "set -u" instead of "set -euo pipefail" so the
    exit code can be recorded, and place directives before the first command as PHAL did.
    extra_directives with the other scheduler's prefix are rejected; this fixes PHAL feeding
    slurm_directives to PBS. Every CLI call is bounded by scheduler.command_timeout_seconds.
