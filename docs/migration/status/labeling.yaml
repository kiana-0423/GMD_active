  findings: [F-26]
  notes: >-
    PHAL's squeue/sacct table maps the same way, using ExecutionStatus names (PENDING becomes QUEUED;
    TIMEOUT becomes FAILED with walltime_exceeded). sacct is queried with -P
    --format=State,ExitCode, so the exit code is recorded (128 + signal when killed by a signal).
    Explicit mappings: BOOT_FAIL, DEADLINE, SPECIAL_EXIT -> FAILED; REQUEUED/REQUEUE_* -> QUEUED;
    SUSPENDED, STOPPED, RESIZING -> RUNNING; REVOKED -> UNKNOWN. Tested only against fake CLIs:
    Slurm is not installed here.
- id: SCH-004
  status: migrated
  implementation: [src/gmd_active_learning/adapters/schedulers/pbs.py]
  evidence:
    - tests/adapters/schedulers/test_batch_schedulers.py::test_pbs_live_state
    - tests/adapters/schedulers/test_batch_schedulers.py::test_pbs_history_finished_states_check_exit_status
    - tests/adapters/schedulers/test_batch_schedulers.py::test_pbs_history_query_can_be_disabled
