  findings: [F-24, F-25, F-27]
  notes: >-
    Replaced by LabelingService.poll/collect plus datasets.write_dataset_entry. Dataset files: for 28
    golden capped regions (3 scenarios, cluster/graph/slab), GMD's <task>.extxyz/_labels.npz/_metadata.json
    contain every field PHAL's write_dataset_entry wrote, with PHAL's values. That covers the forces,
    mask, original_indices (caps -1) and per-role index arrays; region_labels/atom_role, force_weight,
    energy_weight 0, core_atom_indices and masked_atom_indices; and the positions, symbols, region_code
    and force weights in the extxyz. 6 torn-bond regions skip with GMD's documented capping fix.
    Deliberate differences: the extxyz key is force_weight (GMD_SGT), not mask_weights. GMD adds arrays
    (force_weight, region_code, image_shift, energy, stress), energy and stress weights, and provenance.
    The mask comes from the region roles (F-04). Status sequence: ExecutionStatus and ValidationStatus
    are kept separate. Exit 0 with invalid output is COMPLETED/INVALID, and a non-converged output never
    yields a VALID result (F-27). UNKNOWN reconciles and never fails or resubmits, which removes PHAL's
    race with a still-growing output (F-25). PHAL's JobState values map losslessly
    (labeling.job_states). A restarted controller resumes the persisted job ids.
