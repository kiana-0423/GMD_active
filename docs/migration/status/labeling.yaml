- id: SCH-001
  status: verified
  implementation: [src/gmd_active_learning/adapters/schedulers/local.py]
  evidence:
    - tests/adapters/schedulers/test_local_scheduler.py::test_exit_code_is_recorded
    - tests/adapters/schedulers/test_local_scheduler.py::test_cancel_stops_the_process
    - tests/adapters/schedulers/test_local_scheduler.py::test_cancel_escalates_to_sigkill_when_sigterm_is_ignored
    - tests/adapters/schedulers/test_local_scheduler.py::test_walltime_is_enforced
    - tests/adapters/schedulers/test_local_scheduler.py::test_poll_survives_a_controller_restart
    - tests/adapters/schedulers/test_local_scheduler.py::test_a_restarted_controller_can_cancel
  findings: [F-26]
  notes: >-
    The job runs as a detached session through a shell wrapper that writes .gmd_exit_code atomically.
    The pid, pgid, start time and walltime are kept in .gmd_local_job.json, so polling and cancelling
    work after a controller restart; PHAL kept a Popen in memory and lost the state on restart. Cancel
    sends SIGTERM to the process group, waits cancel_grace_seconds, then sends SIGKILL; PHAL sent
    SIGTERM without waiting. The walltime from resources is enforced (scheduler.local.enforce_walltime).
    A process that disappears without an exit code is FAILED (raw state VANISHED), not RUNNING forever.
    Stdout goes to job.stdout.
