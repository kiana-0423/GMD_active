# Ledger status for DFT labeling (CP2K), schedulers and the backend registry/plugins.
# User documentation: docs/labeling_and_scheduling.md. Test paths are relative to the GMD_active root.
# Real-CP2K evidence ran against CP2K 2026.2 (git:c92cc08, /opt/homebrew/bin/cp2k.psmp); those tests carry
# the pytest marker `cp2k` and skip only when no CP2K binary is found.

- id: BE-001
  status: replaced
  implementation:
    - src/gmd_active_learning/adapters/registry.py
    - src/gmd_active_learning/adapters/schedulers/base.py
    - src/gmd_active_learning/adapters/dft/cp2k/backend.py
    - src/gmd_active_learning/workflow/protocols.py
    - src/gmd_active_learning/labeling/job_states.py
  evidence:
    - tests/labeling/test_job_state_mapping.py::test_every_phal_job_state_round_trips
    - tests/labeling/test_job_state_mapping.py::test_only_pending_and_timeout_are_spelled_differently
    - tests/labeling/test_job_state_mapping.py::test_walltime_failures_from_any_scheduler_report_timeout
    - tests/labeling/test_job_state_mapping.py::test_execution_request_from_command_stringifies_like_phal
    - tests/labeling/test_job_state_mapping.py::test_phal_job_states_are_phal_enum_values
    - tests/workflow/test_backend_contracts.py::test_md_protocol_is_satisfied_only_by_complete_implementations
    - tests/adapters/test_registry.py::test_role_mismatch_raises_type_error
    - tests/adapters/test_registry.py::test_capability_checks
    - tests/adapters/schedulers/test_local_scheduler.py::test_poll_survives_a_controller_restart
    - tests/adapters/dft/test_cp2k_input.py::test_execution_request_paths_are_work_dir_relative
  findings: []
  notes: >-
    Replaced, not ported 1:1. BackendRole and RuntimeStatus are ported. A structural Backend protocol
    (name, role, capabilities, check_runtime) replaces the ABCs, and an incomplete implementation does
    not satisfy it. The MD/MLIP/Trainer protocols live in workflow/protocols.py. The scheduler contract is
    submit/poll/cancel/reconcile with typed resources; CP2KBackend's parse and validate steps fill PHAL's
    DFTBackend gap. ExecutionRequest.from_command stringifies command parts and turns work_dir into a Path
    exactly as PHAL did. The stdout/stderr paths and free-form resources moved to the scheduler and typed
    SchedulerResources. JobState is replaced by contracts.ExecutionStatus. Seven of PHAL's nine values
    are spelled identically. pending became queued. timeout became failed with raw_state TIMEOUT and
    walltime_exceeded, so a walltime kill gets its own retry policy. labeling.job_states translates both
    ways, and every PHAL value round-trips. PHAL never persisted job states (its jobs dict lived in
    memory, see LAB-007), so no PHAL-era files need migrating.
