  notes: >-
    F-31 fixed. Plugin failures are keyed by the normalized role:name, so a plugin registered as
    "mlip:My-Engine" reports its import error as PluginLoadError (a RuntimeError subclass). Any
    exception raised during import is contained. A plugin replaces a built-in only when listed in
