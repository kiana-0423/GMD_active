  status: verified
  implementation: [src/gmd_active_learning/adapters/schedulers/batch.py, src/gmd_active_learning/adapters/schedulers/config.py]
  evidence:
    - tests/adapters/schedulers/test_batch_schedulers.py::test_slurm_submit_renders_typed_resources_and_parses_job_id
    - tests/adapters/schedulers/test_batch_schedulers.py::test_pbs_submit_renders_pbs_resources_not_slurm_directives
    - tests/adapters/schedulers/test_batch_schedulers.py::test_foreign_directives_are_rejected
    - tests/adapters/schedulers/test_batch_schedulers.py::test_failed_submit_raises_scheduler_error_with_stderr
