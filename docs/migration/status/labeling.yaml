- id: LAB-005
  status: verified
  implementation: [src/gmd_active_learning/adapters/dft/cp2k/parse.py, src/gmd_active_learning/adapters/dft/cp2k/validation.py]
  evidence:
    - tests/adapters/dft/test_cp2k_parse.py::test_f12_phal_energy_regex_misses_real_2026_output
    - tests/adapters/dft/test_cp2k_parse.py::test_phal_style_synthetic_output_fields
    - tests/adapters/dft/test_cp2k_parse.py::test_real_periodic_stress_is_converted_from_bar_with_ase_sign
    - tests/adapters/dft/test_cp2k_parse.py::test_real_unconverged_output_is_invalid_with_reason
    - tests/adapters/dft/test_cp2k_parse.py::test_validation_switches
  findings: [F-12, F-27]
  notes: >-
    F-12 reproduced on real CP2K 2026.2 output: "ENERGY| Total FORCE_EVAL ( QS ) energy [hartree] x"
    has no colon, so PHAL's regex never matched. It is fixed: the unit is read and converted, and the
    energy is required by default (cp2k.validation.require_energy).

    Stress is printed in [bar] with lower-case rows in 2026.2, which PHAL never parsed. It is now
    converted to eV/A^3 with the ASE sign convention (-CP2K value).

    The F-27 rule is kept: a success marker is required and there must be no "SCF run NOT converged"
    or ABORT marker. Finite energy, forces and stress are also required. Added checks:
    - the force count equals the atom count;
    - CP2K terminated normally (PROGRAM ENDED);
    - the abort message is captured.

    The residual comes from the last row of the SCF table (PHAL's regex was loose). The CP2K version
    ("2026.2") and git revision are recorded. ML-SCF markers are parsed. provenance() is JSON-safe.
    LabelResult keeps ExecutionStatus and ValidationStatus separate.
