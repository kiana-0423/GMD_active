# Ledger status for DFT labeling (CP2K), schedulers and the backend registry/plugins.
# User documentation: docs/labeling_and_scheduling.md. Test paths are relative to the GMD_active root.
# Real-CP2K evidence ran against CP2K 2026.2 (git:c92cc08, /opt/homebrew/bin/cp2k.psmp); those tests carry
# the pytest marker `cp2k` and skip only when no CP2K binary is found.

