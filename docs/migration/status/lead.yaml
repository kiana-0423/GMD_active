  findings: []
  notes: >-
    CandidateSelector recomputes the unique set from scratch on every selection, so the eviction scenario
    re-admits the third candidate. Additions: a persistent lifecycle (store candidate states pending ->
    selected -> labeling -> labeled|rejected|invalid|failed with reasons), labeled-history dedup
    (compare_with_labeled), and per-event/per-cycle/total budgets. PHAL semantics need max_per_event=null,
    min_score=null and compare_with_labeled=false. A candidate refused by the event budget does not
    suppress candidates of other events.
- id: AL-004
  status: verified
  implementation: [src/gmd_active_learning/active_learning/candidates.py]
  evidence:
    - tests/active_learning/test_phal_candidate_parity.py::test_fingerprints_of_golden_regions_match_phal_formula
    - tests/active_learning/test_phal_candidate_parity.py::test_nan_case_of_phal_is_finite_and_does_not_block_later_candidates
