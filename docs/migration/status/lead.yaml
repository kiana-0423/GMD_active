    - tests/active_learning/test_phal_candidate_parity.py::test_type_weighted_fingerprint_is_intensive_and_blocks_are_comparable
    - tests/active_learning/test_candidates.py::test_periodic_regions_use_minimum_image_distances
  findings: [F-30]
  notes: >-
    Plain and type-weighted pair-distance histograms (16 bins, 8 A, L2, keep if >= threshold) equal
    PHAL's formula (scipy pdist + density=True, re-implemented in the test as an oracle) to rtol 1e-12 on
    every golden raw and capped region. histogram_normalisation defaults to density, so
    diversity_threshold keeps PHAL's meaning. Deliberate deviations: (1) F-30: where PHAL's density is NaN
    (no pair inside the cutoff), GMD returns zeros, so the candidate neither vanishes nor blocks later
    ones. (2) pair_distances defaults to minimum_image, which is identical to PHAL for non-periodic
    regions (all golden regions are pbc=False). PHAL's plain pdist stays selectable (pair_distances:
    plain) and is what convert-phal-config sets. The former GMD_active cosine metric is not offered; L2
    is the single canonical metric. PHAL mode aliases are accepted, and unknown modes raise.
- id: AL-005
  status: verified
  implementation: [src/gmd_active_learning/workflow/controller.py, src/gmd_active_learning/workflow/store.py]
  evidence:
    - tests/workflow/test_scheduling.py::test_replayed_queue_gives_identical_task_ids_and_transitions
    - tests/workflow/test_scheduling.py::test_raising_submitter_fails_only_that_task_and_the_queue_continues
    - tests/workflow/test_scheduling.py::test_restart_mid_queue_resubmits_nothing_already_submitted
    - tests/workflow/test_controller.py::test_crash_after_submission_does_not_duplicate_jobs
    - tests/e2e/test_online_pipeline.py::test_online_loop_polls_the_label_to_completion_and_resumes_md_with_the_new_model
  findings: [F-24]
  notes: >-
    The queue is the persistent workflow store (write-ahead "submitting" intent, then
    find_submission/submit, then "submitted"). Task ids are deterministic per region and settings, so a
    replayed run gives identical ids (PHAL's were uuid-suffixed). As in PHAL, a raising submitter marks
    only that task failed, with the reason in failure_reasons and a failed candidate list, and the queue
    continues. A controller killed after the 1st, 2nd or 3rd submission resubmits nothing on restart.
    Status mapping: PHAL queued = candidate "selected", submitted = task "submitted", failed = task
    "failed". PHAL's "skipped" (block cooldown) happens in extraction, which emits no region. Added: the
    labeling queue is bounded (max_pending_tasks, backpressure) and tasks are polled to completion.
