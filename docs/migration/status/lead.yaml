  findings: [F-05]
  notes: >-
    Every region of an event gets the event's max score (PHAL: frame-level max_score), and ties keep
    insertion order (tie_break: insertion, with insertion order kept in the store by rowid). Over all
    golden capped regions (3 scenarios x 4 modes x thresholds 0.1/0.5/2.0 x dedup on/off x caps 1..N),
    the selected ids and their order equal PHAL's CandidatePool algorithm. No per-region scoring variant
    exists, so the default is PHAL parity. Selection is part of the online loop (PHAL selected offline only).
