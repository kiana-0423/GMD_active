- id: TRN-005
  status: verified
  implementation: [src/gmd_active_learning/retraining/triggers.py, src/gmd_active_learning/workflow/controller.py]
  evidence:
    - tests/workflow/test_trigger_registry_parity.py::test_trigger_table_against_phal
    - tests/workflow/test_trigger_registry_parity.py::test_dry_run_free_state_advances_only_after_training
    - tests/workflow/test_store_registry.py::test_retrain_trigger_rules
  findings: [F-13]
  notes: >-
    A 16-row table over (config, manual, new samples, pending labels, last training, clock) compares
    against PHAL's rule, re-implemented as an oracle. Reasons match except five documented deviations
    (F-13). (1) The first sample no longer bypasses min_new_samples; train_on_first_samples restores PHAL.
    (2) Manual with nothing new is refused (no_new_samples). (3) Outstanding labels block training;
    wait_for_pending_labels=false restores PHAL. (4) enabled=false blocks automatic triggers only.
    (5) interval_hours=null disables the time trigger. Samples are counted from ingested store rows,
    not files. There is no dry run: last_trained_at advances only after a real training run. Training
    goes through the Trainer protocol (GMDSGTBackend).
- id: TRN-006
  status: verified
  implementation: [src/gmd_active_learning/retraining/registry.py, src/gmd_active_learning/workflow/store.py]
  evidence:
    - tests/workflow/test_trigger_registry_parity.py::test_register_promote_rollback_round_trip_publishes_the_export
    - tests/workflow/test_trigger_registry_parity.py::test_reregistering_is_idempotent_and_never_overwrites
    - tests/workflow/test_trigger_registry_parity.py::test_sha_is_verified_at_promotion_and_rollback
    - tests/workflow/test_trigger_registry_parity.py::test_concurrent_writers_in_threads_share_one_store
    - tests/workflow/test_trigger_registry_parity.py::test_concurrent_writer_processes_share_one_store
    - tests/workflow/test_store_registry.py::test_registry_copies_hashes_and_detects_tampering
    - tests/integration/test_rollback_real.py::test_rejection_on_real_metrics_and_rollback_with_resumed_md
  findings: [F-14]
  notes: >-
    Register -> gated promote -> rollback round trip. The deployed GMD_SGT export path and its sha256
    are published through the ModelArtifact contract. Model ids are content-derived, so re-registering
    the same artifacts is idempotent (the existing record is re-verified and returned) and an existing id
    can never be overwritten. sha256 is recorded at registration and verified at every promotion and
    rollback; a tampered export blocks promotion. Concurrent writers (8 threads, 4 processes) share one
    SQLite store, with private staging directories per writer instead of PHAL's lock file. Promotion
    history lives in the store. Naming is model ids, not allegro_vNNN.
