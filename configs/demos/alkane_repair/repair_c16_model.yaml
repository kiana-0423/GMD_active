# Alkane repair benchmark, C16H34: model and online monitor (part-beta study format: monitor + training).
# The monitor section is arm D's pre-registered staged PHAL monitor: GMD_active's defaults
# (configs/sections/monitor.yaml) with temporal metrics ON (the repair experiment uses real trajectories)
# and mlip_force_deviation OFF (no separate reference model exists). Arms C and the ablations derive
# their monitors from this section through arms[].monitor_overrides in repair_c16.yaml.
name: repair_c16_model
base_config: repair_c16_alpha.yaml
inputs: {parents: parents.jsonl, labels: labels.jsonl}
output_subdir: model_side

monitor:
  metrics:
    mlip_force_deviation: {enabled: false}   # needs a ReferenceForceProvider; none in this benchmark
  running_stats: {warmup_frames: 5}

training:
  sgt: {source_path: ../GMD_SGT, device: cpu, committee_size: 2}   # primary + 2 committee members (seeds s, s+1, s+2)
  model:                     # GMD_SGT UnifiedEquivariantMLIP, local only (fragment and parent inputs comparable)
    n_species: 10
    n_blocks: 2
    scalar_dim: 32
    irreps: "32x0e + 8x1o"
    l_max: 1
    n_basis: 8
    local_cutoff: 4.0
    lr_cutoff: 4.0
    long_range_type: none
    n_heads: 1
    avg_neighbors: 12.0
  train:                     # initial model (overridden per stage only via repair_c16.yaml initial_model.train_overrides)
    n_epochs: 1000
    batch_size: 1            # pilot finding: batch_size 4 on few structures gave too few optimiser steps
    lr: 2.0e-3
    lr_min: 2.0e-5
    warmup_steps: 50
    patience: 200
    w_energy: 0.1
    w_force: 1.0
    energy_loss: mae
    force_loss: rmse
    val_fraction: 0.0
    test_fraction: 0.0
  force_weights: {core: 1.0, inner_buffer: 0.3, outer_buffer: 0.0, boundary: 0.0, h_cap: 0.0, unassigned: 0.0}
  full_system_force_weight: 1.0
  energy: {full_system_weight: 1.0, uncapped_fragment_weight: 0.0}   # capped fragments: energy weight 0 (never the parent's energy)
  initial_splits: [initial_train]
  validation_splits: [validation]
  mode: scratch
