# Alkane repair benchmark, SMOKE profile: model and online monitor (mechanics only).
name: repair_smoke_model
base_config: repair_smoke_alpha.yaml
inputs: {parents: parents.jsonl, labels: labels.jsonl}
output_subdir: model_side
monitor:
  metrics:
    mlip_force_deviation: {enabled: false}
  running_stats: {warmup_frames: 3}
training:
  sgt: {source_path: ../GMD_SGT, device: cpu, committee_size: 2}
  model: {n_species: 10, n_blocks: 2, scalar_dim: 32, irreps: "32x0e + 8x1o", l_max: 1, n_basis: 8, local_cutoff: 4.0, lr_cutoff: 4.0,
          long_range_type: none, n_heads: 1, avg_neighbors: 12.0}
  train: {n_epochs: 150, batch_size: 1, lr: 2.0e-3, lr_min: 2.0e-5, warmup_steps: 20, patience: 60, w_energy: 0.1, w_force: 1.0,
          energy_loss: mae, force_loss: rmse, val_fraction: 0.0, test_fraction: 0.0}
  force_weights: {core: 1.0, inner_buffer: 0.3, outer_buffer: 0.0, boundary: 0.0, h_cap: 0.0, unassigned: 0.0}
  full_system_force_weight: 1.0
  energy: {full_system_weight: 1.0, uncapped_fragment_weight: 0.0}
  initial_splits: [initial_train]
  validation_splits: [validation]
  mode: scratch
