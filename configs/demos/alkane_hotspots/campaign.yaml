# Alkane hotspot demonstration: PLANNED main campaign (not executed), stage 1 = C16H34 + C32H66.
# Sized from MEASURED costs (docs/demos/alkane_hotspots/results/timing_probe.json and the executed C16
# pilot, 2026-11-07; 5 OpenMP threads, jobs serial because concurrency gave no throughput):
#   full C16H34 label ~0.73 core-h (mean 526 s wall), full C32H66 ~13.5 core-h (~2.7 h wall, extrapolated
#   from measured SCF steps), fragments (14-41 atoms) 0.06-0.3 core-h.
#   Full labels: 32 x C16 (~23 core-h) + 32 x C32 (~430 core-h); fidelity + acquisition fragments ~50 core-h.
#   => budget 550 core-h, ~110 h wall serially on the development workstation (or a cluster partition).
# C64H130/C128H258 are NOT part of stage 1: the goal admits them only after validation passes and if
# the budget permits, and their isolated cubic boxes (~95 A / ~170 A) make each full label cost far
# more than a C32 label (not measured). A stage-2 file sets chain_lengths [64, 128] with
# systems.allow_long_chains: true and its own measured budget.
# Changes from the pilot, each motivated by a pilot finding (docs/demos/alkane_hotspots.md):
#   - 4 bases per split and chain length (pilot: 1): >= 3 normal frames for the monitor warm-up and >= 2
#     split groups for group-bootstrap intervals;
#   - 300/50 Ry as in the pilot (converged to 0.006 eV/A RMS vs 400/60 Ry on C16H34).
# Thresholds under `fidelity` are pre-registered: they are frozen at the first `fidelity-prepare` of this
# artifacts_root and must not be changed afterwards. Artifacts: ../alkane_artifacts/campaign (outside git).
name: campaign
description: >-
  Stage 1: C16/C32, 64 parents (16 base conformations x {normal, torsion, bend, contact}),
  PBE-D3(BJ)/DZVP-MOLOPT-SR-GTH/GTH-PBE, 300/50 Ry, isolated cubic WAVELET box.
artifacts_root: ../alkane_artifacts/campaign
seeds:
  generation: 20261107
  split: 7
systems:
  chain_lengths: [16, 32]
  allow_long_chains: false     # stage 2 (C64/C128) needs an explicit opt-in file
  long_chain_threshold: 32
geometry:
  cc_bond: 1.53
  ch_bond: 1.09
  angle_deg: 109.47122063449069   # tetrahedral, arccos(-1/3)
  covalent_scale: 1.2
generation:
  n_parents: 64
  per_base: {normal: 1, torsion: 1, bend: 1, contact: 1}
  max_candidates_per_slot: 50
families:
  thermal:
    amplitude: 0.03          # A, Gaussian standard deviation per component, same field for every parent of a base
  torsion:
    enabled: true
    deltas_deg: [120.0, -120.0, 60.0, -60.0]   # change of the trans dihedral (120 = gauche)
    locations: [0.35, 0.5, 0.65]               # fraction along the chain
  bend:
    enabled: true
    deltas_deg: [-12.0, 12.0, 20.0]            # change of one C-C-C angle
    locations: [0.35, 0.5, 0.65]
  contact:
    enabled: true
    target_distances: [2.0, 2.3, 2.6]          # A, min distance between two chain segments >= 6 carbons apart
    target_tolerance: 0.02
    locations: [0.4, 0.5]
    fold_bonds: 5
    min_segment_separation: 6
    n_starts: 4
    clash_margin: 0.05
    max_evaluations: 4000
checks:
  bond_tolerance: 0.25        # A vs covalent-radius sum; thermal noise (0.03 A per component) reaches ~0.17
  exact_tolerance: 1.0e-8
  exact_angle_tolerance_deg: 1.0e-6
  max_angle_deviation_deg: 15.0
  nonbonded_min_bond_separation: 3
  min_nonbonded_hh: 1.8
  min_nonbonded_ch: 2.2
  min_nonbonded_cc: 2.5
  contact_window: [1.8, 2.9]
splits:
  fractions: {initial_train: 0.25, calibration: 0.25, validation: 0.25, final_eval: 0.25}   # 4 bases each (2 x C16, 2 x C32)
  group_key: base_conformation
  stratify_by: chain_length
  assignment_order: [calibration, final_eval, initial_train, validation]
cp2k:
  executable: cp2k.psmp
  data_dir: null             # $CP2K_DATA_DIR, else <prefix>/share/cp2k/data next to the executable
  launcher: []               # e.g. [mpirun, -np, "{ntasks}"] with mpi_ranks > 1
  omp_threads: 5
  mpi_ranks: 1
  functional: PBE
  basis: DZVP-MOLOPT-SR-GTH
  potential: GTH-PBE
  dispersion: true           # DFT-D3(BJ)
  charge: 0
  multiplicity: 1
  cutoff: 300.0              # Ry; converged vs 400 Ry on C16H34 (timing_probe.json)
  rel_cutoff: 50.0
  eps_scf: 1.0e-6
  max_scf: 100
  poisson_solver: WAVELET
  box_padding: 6.0
  h_only_opt:
    enabled: false           # caps sit at 1.09 A along the cut C-C bond; relaxing them costs a GEO_OPT per fragment
    max_iter: 50
  smoke_only: false
labels:
  full_splits: [initial_train, calibration, validation, final_eval]
  poll_interval_s: 10.0
  max_concurrent_jobs: 1
fragments:
  sites: [perturbation_site, normal_control]
  normal_location: 0.5
  graph_hops: [2, 3, 4]
  cluster:
    core_radii: [1.5]
    buffer_radii: [3.0, 4.0, 5.0]
  vacuum_padding: 4.0
  cap_clash_distance: 1.5
fidelity:
  core_force_rmse: 0.03        # eV/A, pooled over all calibration core atoms of a setting
  max_core_force_error: 0.10   # eV/A, max |F_frag - F_parent| over calibration core atoms
  max_failures: 0
  selection_objective: min_measured_cost
  distance_bins: [0, 1, 2, 3, 4, 6, 100]
budgets:
  max_full_labels: 64
  max_fragment_labels: 600
  max_total_cpu_core_hours: 550.0   # from measured per-label costs (header)
  per_job_walltime_s: 14400     # C32H66 measured ~2.7 h
  max_atoms_per_fragment: 80
  max_atoms_full: 400
