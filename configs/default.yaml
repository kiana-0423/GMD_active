# GMD_active packaged default configuration: every section with every key at its default.
# GENERATED from the section models; do not edit by hand. Regenerate with
#   python -m gmd_active_learning.config --write-default configs/default.yaml
# Copy it and change what you need; unknown keys and sections are errors. The placeholders
# workflow.run_id, md.executable (looked up on PATH) and md.initial_structure (relative to this
# file) must be set for a real run. Section documentation: configs/sections/*.yaml.
workflow:
  run_id: default-run
  max_cycles: 1
  segment_steps: 1000
  segments_per_cycle: 1
  max_pending_tasks: 50
  backpressure: pause_sampling
  stop_md_on_monitor_stop: true
  poll_interval_s: 5.0
  max_poll_wait_s: 3600.0
  rollback_on_segment_failure: true
  save_event_frames: true
  candidates:
    enabled: true
    fingerprint: type_weighted_pair_distance_histogram
    fingerprint_bins: 16
    fingerprint_cutoff: 8.0
    pair_distances: minimum_image
    histogram_normalisation: density
    deduplicate: true
    diversity_threshold: 0.1
    compare_with_labeled: true
    tie_break: insertion
    max_per_cycle: 20
    max_per_event: 4
    max_total: null
    min_score: 0.0
    core_atoms_only_for_ranking: false
  retraining:
    enabled: true
    min_new_samples: 10
    interval_hours: 24.0
    train_on_first_samples: false
    wait_for_pending_labels: true
  promotion:
    max_force_rmse: 0.5
    max_energy_rmse_per_atom: null
    max_relative_regression: 0.05
    require_validation_samples: 1
    require_export_validation: true
    export_max_force_deviation: 0.0001
    require_engine_smoke_test: true
md:
  executable: gmd
  initial_structure: initial_structure.xyz
  directives:
    time_step: 0.5
    velocity: 300.0
    velocity_init: random
    velocity_seed: 1
  frame_interval: 10
  control_poll_interval: 1
  checkpoint_every: 0
  reader_poll_s: 0.05
  segment_timeout_s: 86400.0
  env:
    OMP_NUM_THREADS: '1'
  smoke_steps: 5
  launcher: []
  check_species: true
mlip:
  source_path: null
  device: cpu
  train: {}
  finetune_from_active: true
  seed: 1234
  committee_size: 0
  export_filename: model.pt
  validation_max_structures: 50
monitor:
  enabled: true
  engine: staged
  neighbors:
    lj_cutoff: 6.0
    coordination_cutoff: 6.0
  metrics:
    force:
      enabled: true
      weight: 1.0
      z_threshold: 4.0
    delta_force:
      enabled: true
      weight: 1.5
      z_threshold: 4.0
    displacement:
      enabled: true
      weight: 1.0
      z_threshold: 4.0
    rmin:
      enabled: true
      weight: 1.0
      threshold: 0.8
    delta_q:
      enabled: true
      weight: 1.0
      threshold: 0.5
      scale: 1.15
      power: 6.0
    lj_residual:
      enabled: true
      weight: 2.0
      estimator: linear
      lazy: true
      lazy_threshold: 3.0
      condition_limit: 10000.0
      sigma_min: 0.2
      sigma_max: 10.0
      relative_delta: 1.0e-08
      nonlinear_max_nfev: 400
    mlip_force_deviation:
      enabled: true
      weight: 2.0
    committee:
      enabled: true
      weight: 2.0
      min_members: 2
  running_stats:
    enabled: true
    warmup_frames: 5
    min_std: 1.0e-08
    warmup_policy: suppress
    first_frame_deltas: not_evaluated
  stages:
    light_interval: 1
    physics_interval: triggered
    full_interval: triggered
    scheduled_full_interval: 1
    screen_threshold: 4.0
    physics_threshold: 5.0
    label_threshold: 6.0
    min_trigger_atoms: 1
  actions:
    save_on_trigger: true
    checkpoint_score: null
    stop_score: null
    stop_min_distance: 0.6
    stop_max_force: null
  global_lj:
    window_size: 20
    cutoff: 6.0
    ridge_lambda: 1.0e-06
    thresholds:
      lj_residual_candidate: 0.3
      lj_residual_stop: 0.6
      max_force_stop: 20.0
      min_distance_stop: 0.6
      ensemble_deviation_candidate: 0.15
      ensemble_deviation_stop: 0.3
      parameter_jump_ratio: 5.0
    parameter_bounds:
      epsilon_min: 1.0e-06
      epsilon_max: 10.0
      sigma_min: 0.5
      sigma_max: 8.0
    weights:
      lj_residual: 1.0
      param_anomaly: 1.0
      param_jump: 0.5
      ensemble_deviation: 1.0
      max_force: 0.5
      min_distance: 0.5
      reliability_model: 0.5
  driver:
    continue_on_error: false
    max_errors: 1
    max_consecutive_timeouts: 10
    poll_timeout_s: null
    stop_on_stop_action: true
    summary_interval: 0
    progress_file: null
