      version: "v2026.2"
      commit: "67b5da876dd6a76b8b021d5a04d1c81ba79a4c50"
      tag_object: "09496e055e132aa3dba53a7751ebdf432b4ebb78"
      repository_url: "https://github.com/cp2k/cp2k.git"
      revision_string: "git:c92cc08"
      build_system: cmake
    binary: "cp2k.psmp"
    install_prefix: "/opt/cp2k"
    compiler:
      family: GCC/GFortran
      source: "ubuntu:24.04 apt (gcc/g++/gfortran 13)"
    mpi:
      implementation: OpenMPI
      source: "ubuntu:24.04 apt (OpenMPI 4.1)"
    math_libraries:
