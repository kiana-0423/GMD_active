  # in the NGC PyTorch wheel, plus GMD_SGT (used only to export the random
  # integration-probe model at image build time).
  gmd:
    image_tag: "gmd-v2.5-9-g54ac558-a1"
    dockerfile: "containers/Dockerfile.gmd"
    base_image: "nvcr.io/nvidia/pytorch:25.09-py3"
    base_image_digest: "sha256:89172d8ef9c4641aacdcddf02c085bf7a736501b443ce2c4e0a660754f67106b"
    base_image_digest_source: "PHAL containers/versions.yaml candidates.train_stack_a at 96263b6 (NGC Registry V2 query, 2026-07-10); not re-queried"
    inherited:
      os: "ubuntu:24.04"
      python: "3.12"
      cuda: "13.0.1"
      torch: "2.9.0a0+50eac811a6"
      torch_cxx11_abi: true
    gmd:
      repository: "https://github.com/kiana-0423/GMD.git"
      source: sibling-checkout
      default_source_path: "../GMD"
      version: "v2.5-9-g54ac558"
      cmake_project_version: "2.4.0"
      base_tag: "v2.5"
      base_tag_commit: "1301bb7cca4c03585ec03372d5b8217f3316679d"
      branch: "al-integration"
      commit: "54ac558e30f9fb85a3474f7749016e24aa109a46"
      binary: "gmd"
      cmake:
        build_type: "Release"
        enable_torch: true
        enable_mpi: false
        enable_cuda: false
        torch_device: "cpu"
    gmd_sgt:
      version: "0.4.0"
      commit: "49ece72edabf46e1e5ee9a3949071acc650c7a13"
    python_packages:
      e3nn: "0.6.0"
      ase: "3.29.0"
      pyyaml: "6.0.3"
    probe_model:
      purpose: "integration_probe_only"
      scientifically_valid: false
      training_steps: 0
      model_type: "AllegroStyleBackbone"
      path: "/opt/gmd_al/probes/gmd/sgt-probe.pt"
      sha256: null
    oci_image: null
    oci_digest: null
    sif_sha256: null
    status: not_built
    validation:
      image_build: not_run
      static_binary_check: not_run
      sif_conversion: not_run
      run0: not_run
      run10: not_run
      energy_finite: not_run
      miyabi_gh200: not_run
      status: not_validated

  # Training role: GMD_SGT on the same NGC PyTorch base as the gmd image, so a
  # model exported here is loaded by the identical LibTorch in GMD.
  sgt_train:
    image_tag: "sgt-train-v0.4.0-49ece72-a1"
    dockerfile: "containers/Dockerfile.sgt-train"
    base_image: "nvcr.io/nvidia/pytorch:25.09-py3"
    base_image_digest: "sha256:89172d8ef9c4641aacdcddf02c085bf7a736501b443ce2c4e0a660754f67106b"
    base_image_digest_source: "PHAL containers/versions.yaml candidates.train_stack_a at 96263b6 (NGC Registry V2 query, 2026-07-10); not re-queried"
    inherited:
      os: "ubuntu:24.04"
      python: "3.12"
      cuda: "13.0.1"
      torch: "2.9.0a0+50eac811a6"
    gmd_sgt:
      repository: "https://github.com/kiana-0423/GMD_SGT.git"
      source: sibling-checkout
      default_source_path: "../GMD_SGT"
      distribution: "gmd-sgt"
      module: "gmd_sgt"
      version: "0.4.0"
      describe: "v0.2-11-g49ece72"
      branch: "al-weighted-training"
      commit: "49ece72edabf46e1e5ee9a3949071acc650c7a13"
    python_packages:
      e3nn: "0.6.0"
      ase: "3.29.0"
      pyyaml: "6.0.3"
    not_installed:
      torch_cluster: "optional GMD_SGT extra; no pinned linux/arm64 wheel for the NGC torch build, GMD_SGT falls back to its dense neighbour search"
      torch_scatter: "optional GMD_SGT extra; GMD_SGT uses its pure-torch scatter"
    oci_image: null
    oci_digest: null
    sif_sha256: null
    status: not_built
    validation:
