#
# Single version manifest for GMD_active container images (GMD, GMD_SGT, CP2K).
# containers/build.sh reads it with a small awk reader: keep 2-space
# indentation and scalar values for every key build.sh resolves.
#
# Honesty rules for this file:
# - Every pin is exact: a 40-hex commit, an exact version, or a fixed tag plus
#   digest. No latest/stable/main, no ranges.
# - Nothing here has been built or validated. Docker was not running when this
#   manifest was written and no image, OCI digest or SIF hash exists yet, so
#   every output digest is null and every status is not_built / not_validated.
# - Base-image digests are not invented: the two that are filled in were
#   recorded by PHAL (NGC Registry V2 query on 2026-07-10; ../cp2k-ml-scf
#   VERSION_LOCK.md) and are marked with their provenance. A null digest makes
#   build.sh print "base_image_digest=unpinned" and refuse to push.
schema_version: 1
infrastructure_revision: "gmd-al-containers-1"
status: not_built

platform:
  os: linux
  architecture: arm64
  target_system: miyabi-g
  cpu: nvidia-grace
  gpu: gh200
  scheduler: pbs-professional
  apptainer: "1.3.5"
  default_oci_platform: "linux/arm64"

stacks:
