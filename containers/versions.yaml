  # Experimental development/toolchain image for the external cp2k-ml-scf fork
  # (bind-mounted at /workspace/cp2k-ml-scf). It contains no CP2K. Pins mirror
  # ../cp2k-ml-scf/VERSION_LOCK.md, which is authoritative.
  cp2k_ml:
    dockerfile: "containers/Dockerfile.cp2k-ml"
    repository: external
    source: git-managed-fork
    upstream:
      name: CP2K
      version: "v2026.2"
      commit: "67b5da876dd6a76b8b021d5a04d1c81ba79a4c50"
      tag_object: "09496e055e132aa3dba53a7751ebdf432b4ebb78"
      support_branch: "support/v2026.2"
      repository_url: "https://github.com/cp2k/cp2k.git"
      revision_string: "git:c92cc08"
      build_system: cmake
    fork:
      path: "../cp2k-ml-scf"
      version_lock: "../cp2k-ml-scf/VERSION_LOCK.md"
      hooks_verified_against: "v2026.2"
    base_image: "ubuntu:24.04"
    base_image_digest: "sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90"
    base_image_digest_source: "PHAL containers/versions.yaml future_stacks.cp2k_ml at 96263b6 and ../cp2k-ml-scf/VERSION_LOCK.md; not re-queried"
    compiler:
