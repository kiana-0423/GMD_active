      prefix: "/opt/cp2k-toolchain-src/install"
      blas: "openblas-0.3.33"
      lapack: "openblas-0.3.33"
      scalapack: "scalapack-2.2.3"
      fftw: "fftw-3.3.11"
      libint: "libint-v2.13.1-cp2k-lmax-5"
