      sif_conversion: not_run
      cpu_inference: not_run
      cuda_inference: not_run
      miyabi_gh200: not_run
      status: not_validated

  # Labeling role: plain production CP2K (cp2k.psmp, OpenMPI) built from the
  # pinned upstream commit with CP2K's own toolchain for its dependencies.
  cp2k:
    image_tag: "cp2k-v2026.2-a1"
