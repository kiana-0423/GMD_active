[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GMD_active_learning"
version = "0.4.0"
description = "Persistent active-learning controller for GMD molecular dynamics, GMD_SGT potentials and CP2K labeling (successor to PHAL)."
readme = "README.md"
license = { text = "Proprietary; portions derived from PHAL under the MIT License (see NOTICE)" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "torch>=2.1",
  "tqdm>=4.66",
  "pydantic>=2.0",
  "ase>=3.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
]

[project.scripts]
gmd-al = "gmd_active_learning.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: needs real external programs (GMD binary, GMD_SGT); skipped with a reason when absent",
  "cp2k: needs a real CP2K executable; skipped with a reason when absent",
  "slow: long-running tests",
]
